;   绿色」就是只用了资源链造成的（植物的产出物品是 MISC，引擎那一段要求 LVLI）。
;   1 = 启用（默认）；0 = 只用资源链（= v4.27 口径，植物会偏绿）。
;   ★ 启动日志会打 `flora scanned: 主判据就绪 …（RVA 0x1306E80，签名核对通过）`；
;     签名不匹配会自动降级（只影响「扫描前后是否区分」）。
FloraScannedByEngineState=1

; 1 = 走**资源链判据**（默认）：`0x1597A50(资源)`「该资源是否已进勘测数据」，
;     链 = FLOR → 「产出物品」**LVLI** → 首条目 MISC → MISC+0x238 资源数组 → IRES。
;     ★ v4.28：**产出物品直接是 MISC 的（= 植物）不再走这条链**（与引擎
;       `0x159ED90` 的口径一致：它先 `cmp [produce+0x2E],0x3F / jne <跳过>`）。
;     0 = 关掉资源链（星球目标只由 `GetOutlineState` / 学到的绿决定）。
; 0（两个都关）= 退回 v4.24 行为（整个「植物」类别只有一个状态，扫没扫过看起来一样）。
FloraScannedByResource=1

; 「已经扫描过的」星球目标用哪个 outline 状态（0 ~ 11）。默认 **5**。
;   引擎把「已扫描的星球目标」写进 state 4（远）/ 5（近），两者原生色**都是**
;   绿色 `#27C684`（`outline colors[...]` 日志里的 state=4 Bounty / state=5 Social），
;   所以用 5（原版近处用的那个）不会引入任何新颜色、也不会和别人撞色。
;   想让它退成「和未扫描一样」⇒ 设成与 StateFlora 相同的值（7）。
;   ⚠️ 槽位是共享的：5 同时也是「弹药、救援」用的槽位（v4.24 起那个槽位的颜色
;      交给引擎 = 原版绿）⇒ 两者同色，不冲突；改成 4 则与「设备」同槽位
;      （同样是原版绿）。
StateFloraScanned=5

; ★★★ v4.25 / v4.26 / v4.28（诊断）：`flora scan:` 探针最多打几条（默认 8；0 = 关掉）。
;   每条 = 一次**真实的判据查询/命中**（带缓存 ⇒ 同一个引用最多每 30 秒一条，
;   但「放下扫描仪」「换场景 / 读档」会强制作废缓存 ⇒ 那之后会立刻重新判定）：
;     flora scan: ref=XXXXXXXX base=XXXXXXXX 判据 = 引擎自己的扫描状态
;                 `GetOutlineState(ref)`=2（= 原生 IsScanned）-> 已扫描 ⇒ 状态 5
;     flora scan: base=XXXXXXXX 产出字段[+0x260]=XXXXXXXX misc=XXXXXXXX
;                 资源数组[+0x238]=N个 irES=[0x…] | 引擎状态=N | <哪条判据> -> 已扫描=1/0 ⇒ 状态 N（...）
;     flora scan: base=XXXXXXXX 判据 = 单向学习表（本会话已确认「已扫描」）-> 已扫描（★ v4.31）
;     flora scan: ref=XXXXXXXX base=XXXXXXXX 判据 = 引擎状态表捡漏
;                 （引擎亲手画过 state 4/5）-> 已扫描 ⇒ 状态 5（★ v4.33）
;     flora scan: base=XXXXXXXX 记入单向学习表「已扫描」（<来源>）-> 不再重问引擎（★ v4.31 / v4.33）
;                  ↑ 这三行出现 = 「变回青色」的修复在干活；对应统计行的
;                    `| 学习表: 命中=… 沿用=… 捡漏=… 落盘=… 写入=…`（命中 / 捡漏 > 0 就对了）
;   用途：① `已扫描=1` 出现 = 判定真的在干活；
;         ② `引擎状态=N`（1 = 未扫描 / 2 = 已扫描）是主判据的实测值 —— 若它
;            和肉眼不一致（比如没扫过的植物显示 2），把 `FloraScannedByEngineState`
;            改成 0 就可以先退回只用资源链（不用换 DLL）；
;         ③ 出问题时这一行带着偏移与链上各层的指针，可以直接和离线反汇编对照；
;         ④ 链走不通时还会额外打 `flora probe (链没走通): …`（前 3 个 base），
;            把记录 0x180~0x380 里所有 form 指针列出来 —— 偏移到底在哪一眼可见。
;            （植物不会触发它：产出是 MISC = 引擎那一段不适用，不算「走不通」。）
FloraScanProbeMax=8

; ---------------------------------------------------------------------------
;  ★★★ v4.33：「已扫描植物低概率变青」的二次加固（用户实测复现 + 日志实证，见 docs/31）
;  实测日志（2026-09-26 22:39:49 ~ 22:43:11）：换场景 / 读档后**窗口内所有星球目标
;  都被判「未扫描」**（整片青），直到举一下扫描仪（引擎重写 state 4/5）才恢复。
;  三个可修的点：① 每次 `载入画面关闭` 都清空学习表；② 学习表只活在内存里；
;  ③ v4.31 的「沿用旧结论」条件对植物永远不成立。对应下面三个键。
; ---------------------------------------------------------------------------

; 1 = 按引用记忆**落盘**（默认）：文件 = `SAS_AlwaysScan.flora-learn.txt`
;     （与 esm / INI 同级；每学到一条「这个引用已扫描」追加一行：
;      `引用 FormID  base FormID`，都是十六进制）。
;     启动时读回 ⇒ **重开游戏也不用再开一遍扫描仪**（跨会话保留）。
;     ★ v5.1 起按**引用**记录（v4.33~v5.0 是「一行一个 base」）——
;       旧格式的行会被**整体忽略**并在日志里报条数（那种粒度会把同 species /
;       同资源的**所有**实例一起涂绿，正是 v5.1 修掉的问题）；
;       想彻底清空 ⇒ 游戏关闭后直接删掉那个文件即可（下次进游戏会重建）。
;     ⚠️ 引用 FormID 与**存档**绑定：换存档后这些条目大多对不上（那时会重新
;        按引擎状态判），所以不会出现「别的存档扫过的物种在这边也绿」。
FloraLearnPersist=1

; ---------------------------------------------------------------------------
;  ★★★ v5.1.5（订正 R5）：**「已扫描」记忆按存档隔离**（读档 = 存档边界）
;  用户报告（原文）：「未扫描星球资源直接显示绿色问题还存在，特别是重新读档后
;   （未扫描时的存档）问题非常严重」。
;  根因：「已扫描」是**存档里勘测数据**的事实，而按引用记忆（含上面的落盘文件）
;   不区分存档 ⇒ 在「后玩的存档」里学到的绿会漏到「更早的存档」里；再叠加
;   「按物种（base）扩散表」⇒ 同 species / 同资源整片变绿（问题被放大）。
;  修法（读档边界用**引擎自己的读档事件** `TESLoadGameEvent` 当候选信号；
;   ★ v5.1.6 起还要**资源链证据**成立才作废 —— 实测部分「传送 / 换世界空间」
;   也会发这个事件，旧口径会把真绿误作废，见下面的 FloraLoadBoundaryEvidence）：
;    ① 每次「确认的读档」：记忆的「存档作用域」+1 ⇒ 只有「**本存档内当场见证**」的绿
;       （引擎亲手画 4/5 / 引擎状态 == 2 / 资源链命中）才算数；
;    ② 每次「确认的读档」：**清空按物种扩散表**（它只该由本存档内的见证重建）；
;    ③ 每次读档候选：用**资源链**（引擎自己的 `0x1597A50`）复核记忆里出现过的 base
;       —— 链走通且答「这个资源不在勘测数据里」⇒ 该 base 的条目**丢掉**
;       （矿脉 / 气泉 / 液池；植物的产出是 MISC ⇒ 链不适用，交给①）。
;       ★ v5.1.6：复核**延后 4 秒**（等世界稳定）跑 + **跳过**「只见证于别的
;       世界空间」的 base；**一个 base 都证伪不了 ⇒ 判定「传送 / 读同一存档」
;       ⇒ 全部不作废**（记忆保持有效）。
;  取值：
;    1 = ★ 默认（推荐）：本会话**第一次**读档仍信任落盘记忆（= 重开游戏继续玩
;        同一个存档时，扫过的目标不用再开一遍扫描仪）；之后按上面的「证据驱动」
;        口径处理（有证伪才作废）。
;        代价（如实说明）：**真读回一个更早的存档**时，**已扫描的植物**在你
;        「先举一次扫描仪」之前会显示成未扫描的青色（引擎那时才会把 4/5 画出来
;        让我们学到）；矿脉 / 气泉 / 液池不受影响（资源链当场就能给出正确答案）。
;        而「传送 / 换地图」不再触发这套作废（★ v5.1.6）。
;    2 = 最严格：落盘记忆一律只当提示（连第一次读档也不认），不依赖证据、
;        每次事件都推进 —— 假绿投诉仍在时的对照开关。
;    0 = 旧行为（v5.1.4：记忆永远有效、物种表不清）—— 假绿会回来，只为对照 / 回退。
;  日志：启动 `config: floraMemoryScope=…`、注册 `load event: … sink 已注册`、
;        每次候选 `flora memory: 读档候选 #N（…）-> … 没有一个被证伪 ⇒ 传送/读同一存档 …`
;        或 `flora memory: 读档 #N 处理完（…）-> 资源链证伪 X 个 base …`，
;        统计行 `| 记忆作用域(★v5.1.5): …` 与 `| 读档边界(★v5.1.6): 事件保留= 确认base= 推进=`。
;  ⚠️ 改完要重进游戏（读档事件 sink 在进世界时注册）。
FloraMemoryScope=1

; ---------------------------------------------------------------------------
;  ★★★ v5.1.6（订正 R6）：**「读档边界」改为证据驱动**（治「传送后变青」）
;  用户报告（原文）：「传送切换地图后，出现了已扫描物品变成扫描前青色的问题，
;   开启扫描仪再关闭又变回绿色」。
;  根因：引擎的 `TESLoadGameEvent` **不只在读档时发** —— 实测部分「传送 / 切换
;   地图（换世界空间）」也会发（日志实证：用户那次的传送被记成「读档 #2」）；
;   而 v5.1.5 是「事件 ⇒ 无条件推进作用域 + 清物种表 + 丢条目」⇒ 传送时把
;   **真绿**也作废了（随后一举扫描仪，引擎又把同一批目标画成绿 = 它们在本存档里
;   确实是已扫描的）。
;  修法（三块）：
;    ① **复核延后**：事件只记「待复核」，等「载入画面关闭 + 4 秒且没有新的载入」
;       世界稳定后再跑 —— 避免「换世界空间的那一瞬间」拿到假证伪；
;    ② **跨世界空间跳过**：这个 base 只见证于别的星球 / 世界空间 ⇒ 在当前上下文
;       复核它没有意义 ⇒ 跳过（不当作证伪）；
;    ③ **没有证伪就不作废**：资源链一个 base 都证伪不了 ⇒ 判定「传送 / 读同一存档」
;       （勘测数据没有倒退）⇒ 记忆保持有效（作用域不推进 / 物种表不清 / 条目不丢），
;       只把链**确认**（本存档里已扫描）的绿条目「重见证」回当前作用域。
;    1 = ★ 开启（默认，本次修复）；0 = v5.1.5 旧行为（事件即边界，无条件作废）。
;  说明：`FloraMemoryScope=2`（最严格）不受本开关影响（仍按每次事件都推进）。
;  ⚠️ v5.1.7（订正 R7）起：本开关**只在「读不到游戏时间」时**才生效（回退路径），
;     默认口径已换成下面的 `FloraSaveFingerprint`（游戏时间指纹）。
FloraLoadBoundaryEvidence=1

; ---------------------------------------------------------------------------
;  ★★★ v5.1.7（订正 R7）：**读档边界 = 游戏时间指纹**（默认口径；治「传送后变青」的真正修复）
;  用户报告（原文，R6 之后又报了一次）：「传送切换地图后，出现了已扫描物品变成
;   扫描前青色的问题，开启扫描仪再关闭又变回绿色，这个问题还在」。
;  根因（完整证据链见 docs/40）：v5.1.6 拿「资源链复核有证伪」当「读回了更早的
;   存档」的证据 —— 但**载入刚结束时资源链的否定答案是错的**。用户 2026-09-27
;   10:15 那一局实证：
;     · 10:15:38（载入画面关闭 + 4s）复核 15 个 base ⇒ 9 个「证伪」⇒ 删掉 132 条
;       记忆（用户看到的就是「已扫描物品变青」）；
;     · 10:15:48 用户一举扫描仪，引擎自己把**同一批** base 画成绿（state 4/5）；
;     · 10:16:56 资源链对同一个资源（base=0x270033）答「已扫描」——
;       **同一个函数、同一个资源，80 秒后答案相反**。
;   ⇒ 「没扫描」这个否定答案在载入刚结束的那段时间**没有区分度**（链路上下文
;     没就绪时也答「没扫描」），不能拿它做不可逆的作废。
;  新口径（**游戏时间**，`Calendar::gameDaysPassed`；随存档一起被保存 / 读回）：
;    ① 每条记忆自带**学习时刻**（落盘文件 `SAS_AlwaysScan.flora-learn.txt` 每行的
;       第 3 个字段 = 游戏时间，单位「天」；R6 及更早写的行没有它 ⇒ 算「未知」，
;       用「本会话第一次读档的游戏时间」兜底 = 等价于 R5 的「第一次读档仍然有效」）；
;    ② 每次读档候选（载入画面关闭 + 4s）把**本存档的游戏时间**记成锚点：
;         学习时刻 ≤ 锚点 ⇒ 这个扫描发生在本存档的过去 ⇒ 记忆有效；
;         学习时刻 >  锚点 ⇒ 属于更新的时间线 ⇒ **不在本存档作用域**（不产生绿）；
;    ③ ★ **作废不删条目、而且是可逆的**：再读一个更新的存档，条目就自动回到作用域
;       （v5.1.5 / v5.1.6 是「删掉 + 举扫描仪重学」）；
;    ④ 传送 / 继续同一存档 ⇒ 锚点几乎不动 ⇒ **什么都不作废**（本次修复的核心 ——
;       不再依赖「资源链自己证明自己」这种脆弱证据）；
;    ⑤ 读回更早的存档 ⇒ 只有「未来」那些条目失效，其余照常有效 —— 比 R5 的
;       「一律作废、植物要靠举扫描仪重学」精准得多。
;  取值：
;    1 = ★ 默认（推荐）；0 = 回退到 v5.1.6 的链证据路径（`FloraLoadBoundaryEvidence`）。
;  说明：`FloraMemoryScope=2`（最严格）不走这条（对照开关）；游戏时间读不到时
;    （Calendar 形状校验没过）也会自动回退到链证据路径，并在日志里打 WARN。
;  日志：启动 `config: floraSaveFingerprint=1 -> ★ 读档边界 = **游戏时间指纹** …`；
;        每次候选 `flora memory: 读档候选 #N（…）-> ★ **存档时间指纹**：本存档的游戏时间 = … 天 …`；
;        统计行 `| 存档指纹(★v5.1.7): 锚=…天 处理= 作废=条 表剪= 失败= 存档=`。
FloraSaveFingerprint=1

; ---------------------------------------------------------------------------
;  ★★★ v5.1.8（订正 R8 / 默认 0）：**按物种（base）扩散是否按星球收紧**
;  用户报告（原文，第三次报同一现象）：「传送切换地图后，出现了已扫描物品变成
;   扫描前青色的问题，开启扫描仪再关闭又变回绿色，这个问题还在」。
;  那一局日志（2026-09-27 10:46~10:53，跑的就是 R7 版）实证：
;    · R7 的读档边界**已经不再误作废**（`存档指纹(★v5.1.7): 锚=4.320754天 处理=1
;      作废=0条 失败=0`）；
;    · 10:50:24 星图（`GalaxyStarMapMenu`）⇒ 10:50:45 快速旅行到 B 点之后，
;      `按物种扩散 … 星球外拒=` 一路涨到 37，同一批植物全判成「未扫描」（青色）；
;    · 10:51:29 用户一举扫描仪，**引擎自己**把同 species 的实例画成绿 4/5
;      （`flora scan: 引擎把 ref=0xFF04ECD4（base=0x185489）画成了绿色`）——
;      而这些物种是用户 3 分钟前在 A 点**本会话亲手扫过**的。
;  ⇒ 结论：**引擎的「物种已扫描」知识本来就跨星球生效**（引擎口径 = species 级），
;    R5 的「必须同一颗 worldspace」硬拒绝会把「本存档里明确已扫描」的目标涂成青色。
;  ⇒ R8 默认改回**引擎口径（全局扩散）**；「不跨存档外溢」这件事改由**存档作用域**保证：
;    · 物种表是**会话级**表（不落盘）；读档时按**游戏时间锚点**剪枝（R7）；
;    · 落盘记忆只在**作用域内**才会被播种进物种表（R8 新增，见 `SeedFloraBaseFromRefMemory`）。
;  取值：0 = ★ 默认（引擎口径：物种知识跨星球；`跨星球放行=` 计数可见跨星球放行次数）；
;        1 = R5 严格口径（只在同一颗 worldspace 内扩散；会把上面那批目标误判成青色，
;            只为对照 / 回退 —— 出现「没扫过的星球资源显绿」投诉时才需要打开）。
FloraSpeciesPlanetScope=0

; ---------------------------------------------------------------------------
;  ★★★ v5.1.8（订正 R8）：**物种表用落盘记忆播种**（治「传送 / 继续同一存档后先青后绿」）
;  为什么需要：外景里的星球目标引用是**运行时临时引用**（FormID `0xFF……`），
;   同一个物种的实例在**新会话 / 换场景后换了 FormID** ⇒ 按引用的落盘记忆命中不了
;   （那一局日志：载入后 `记忆: 命中=2`，271 个本已扫描过的植物全在青色；而引擎
;   一举扫描仪就把它们画成绿 ⇒ 那些绿是**本存档的事实**，我们只是「忘了」）。
;  做法：启动载入落盘记忆之后 + **每次读档剪枝之后**，把仍在**本存档作用域内**的
;   绿条目按 **base** 播种进物种表 ⇒ 同 species 的实例（FormID 变了也算）**一开始
;   就是绿的**，不必等玩家举一次扫描仪。
;  安全性：只播种 `FloraEntryInScope()` 判为作用域内的条目（读回更早的存档时，
;   属于「更新的时间线」的条目不算数）；`FloraMemoryScope=2`（最严格）不播种。
