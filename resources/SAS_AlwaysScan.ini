; ---------------------------------------------------------------------------
;  ★★★ v5.2（订正 R9）：**植物「已扫描」= 直读引擎自己的扫描进度表**（默认开）
;  用户指令（原文）：「不能直接读取游戏自己的物件状态来判断吗？……我们还是走植物也
;   直接读游戏本身物件状态的方式，抛弃自己记忆的方法」。
;  这就是「游戏自己的物件状态」：引擎给**已扫描**植物写 state 4/5（原版绿）时用的
;  就是这份数据（`PlayerKnowledge` 物种槽的 `percent`，== 100 = 已扫描）。
;  查询方式（全部只读，证据链见 `docs/42` / 代码常量区 v5.2 段）：
;    · key1 = `[可扫描组件(0x81) + 0x28]`（物种 / 资源 ID）；
;    · key2 = `0x1307180(ref)`（"ref → 知识 ID"的引擎纯查询函数）；
;    · 表   = TLS 单例 `0x23FF640` + 0x8B0（知识库）+ 0x268（主表）；
;    · 两级哈希 = 引擎自己的 `0x24105D0` / `0x23467B0`（FNV-1a，纯只读）；
;    · 命中后读 `[元素+0x20]` = 该物种的扫描进度（0..100）。
;  ⇒ 对**任何引用**（含外景运行时临时引用 `0xFF……`）**任何时刻**可问，
;    不再依赖「引擎在可见范围里画过 / 我们记下来」。
;  判定：`percent == 100` ⇒ 已扫描（绿）；`percent < 100` ⇒ 不判定（继续走别的判据，
;    宁可青）；查询失败 ⇒ 自动回退旧判据链（统计行 `引擎进度直读: … 失败=` 可见）。
;  结果按 **base（物种）**缓存 ⇒ 同 species 实例共享（「扫一个实例 ⇒ 同 species
;    全绿」由引擎数据保证）；读档 / 换场景时清缓存（进度是存档级数据）。
;  取值：1 = ★ 默认（开）；0 = 关闭（回退到旧判据链）。
;  日志：启动 `config: floraEngineProgress=1 …` + `flora progress ready: …`；
;        统计行 `| 引擎进度直读(★v5.2): 问= 满= 未满= 失败= 缓存命中= 冲突= ready= 记忆层=`。
FloraEngineProgress=1

