[General]
; ===========================================================================
;  Starfield Always Scan - 配置
;  ★ 部署位置（2026-09-25 起）：**和 esm 同级** ——
;       MO2 用户：...\mods\Starfield Always Scan (SFSE)\SAS_AlwaysScan.ini
;                （就在 StarfieldAlwaysScan.esm 旁边，和日志同一个目录）
;       手动安装：...\Starfield\Data\SAS_AlwaysScan.ini
;    1.5 及以前放在 Data\SFSE\Plugins\（DLL 旁边）：DLL 会**优先读 esm 同级**，
;    那里没有才回退读老位置（日志里会打 `config file:` 一行说明读的是哪个）。
;  改完直接重进游戏即可生效（启动时读一次）；文件读不到时全部走内置默认值。
;
;  ★ v4.0：旧方案（EFSH 着色器 + Papyrus 信箱）已整体删除，下面的
;     HighlightMode / OutlineState / GlowDurationSecs / OpsPerSecond /
;     BucketSize 五个键**不再存在**（留着也不会被读）。
;     高亮现在只有一条路：直接驱动引擎原生的 outline 描边系统。
; ===========================================================================

; 1 = 启动时就开启；0 = 启动时关闭，进游戏后按热键打开
StartEnabled=1

; 开关热键的虚拟键码（十进制）。
;   F1=112  F2=113  F3=114  F4=115  F5=116  F6=117  F7=118  F8=119
;   F9=120  F10=121 F11=122 F12=123
;   Insert=45 Home=36 PgUp=33 Delete=46 End=35 PgDn=34
;   字母/数字直接用 ASCII：A=65 ... Z=90，0=48 ... 9=57
; 0 = 不注册热键（只能靠 StartEnabled 决定）
HotkeyVK=119

; 1 = 按热键切换时在 HUD 上弹一条提示（Always Scan: ON / OFF）；0 = 不弹。
; ★ 提示由桥脚本（SAS_Bridge.psc）弹出：DLL 把状态写进 GLOB `SAS_Notify`，
;   脚本每 0.5 秒轮询一次。绑定失败时只是没有提示，**高亮不受影响**。
NotifyOnToggle=1

; 高亮半径（米）。原版手持扫描仪的探测半径是 10 米，这里默认给 50 米。
; 范围 5 ~ 500
RadiusMeters=50

; 米 → 游戏单位 的换算系数（0.1 ~ 200）。
; 默认 3.4286 来自官方脚本 HumanHeight 4.0 ≈ 1.2 米 的标定。
; 日志里会同时打出「米」和「游戏单位」两个数：
;     config: unitsPerMeter=3.4286 -> 半径 50.0m = 171.4 游戏单位
; 觉得范围偏小/偏大就改这个值（不用重新编译）：
;   实际只有 25 米 → 改成一半（1.7143）；实际有 100 米 → 改成两倍（6.8571）。
UnitsPerMeter=3.4286

; 同时维护的高亮目标上限（8 ~ 1024）。
; 按距离从近到远一路取，取到 MaxTargets 为止。
MaxTargets=256

; 扫描间隔（毫秒，50 ~ 2000）
ScanIntervalMs=200

; 1 = 每 5 秒往 SAS_AlwaysScan.log（**和 esm 同级的那个**）写统计；0 = 关闭
; （统计里会带：
;   · `category (本轮选中): loot=… | 类别开关跳过 disabled=…`
;     —— 每个类别各选中多少个；disabled 是被类别开关挡掉的数量（见 EnableXxx）；
;   · `candTypes (…)` / `rejTypes (…)`
;     —— 候选目标 / 被过滤目标的 base formType 直方图。
;        ★ 再遇到「某东西不该亮」或「该亮却没亮」时，把这两行连同截图发出来，
;          formType 号直接指向它是哪一类东西（MSTT=? / MISC=? / CONT=? …）。
;   · `corpse (窗口内累加): 尸体=A (kDead位=B StartsDead标志=C 道具=D 炮塔/机器人/倒地=E) | …`
;     —— ★ v4.2 新增。「尸体该亮却没亮」看 A~E 这几个来源计数，再看日志里
;        `corpse probe:` 那几行（带 ref/base 的 FormID，可和画面里的身体对号入座）；
;        「搜空还亮着」看 `empty=` 有没有在涨，不涨就看启动那一行 inventory calibration。
;   · `timing2: …` 性能拆分。)
LogStats=1

; 日志开关 + 文件大小上限（MiB）。
; ★ 2026-09-27 新增；同日订正 R14 升级为「开关 + 上限」（配置项 0 关闭、大于 0 开启）：
;   0      = **完全关闭日志**（不建日志文件、一个字节都不写）—— N 网公开版口径；
;   1~1024 = 开启，上限 N MiB：日志写满**整个清空重来**（不是滚动保留旧文件），
;            占用恒定 ≈ 上限。
;   内置默认 = 0（INI 缺失 / 手删了这个键也一样 = 关闭）；
;   本机排障想留日志就写 10（本机部署的这份就是 10）。
;   改完重启游戏生效；开启时启动日志会打一行 `日志文件：…（上限 N MiB …）` 可核对。
LogMaxMB=0

; 1 = 只高亮玩家正前方的目标（水平夹角在 FrontFovDeg 之内）；0 = 前后都高亮。
; 原版扫描仪靠「中央圆圈」限制，本 MOD 去掉圆圈后用这个选项维持「看得见才亮」的观感。
OnlyInFront=0

; OnlyInFront=1 时的水平视野角（度，20 ~ 360）。360 等效于关闭。
FrontFovDeg=110

; ===========================================================================
;  ★ v4.0：分类分色　　★★ v4.17：物品栏分类（需求 1.6）
; ---------------------------------------------------------------------------
;  每个类别用一个 outline 状态，引擎按状态取不同配色（就是原版扫描仪在
;  「未扫描 / 已扫描 / 已完全扫描 / 追踪 / 悬赏 …」之间换色的那套）。
;
;  ★★ v4.17 起，「可拾取」按**物品栏分类**拆成 6 组（用户需求 1.6 原文：
;     武器、投掷物 / 太空服、背包、头盔、服饰 / 弹药、救援 / 笔记 / 资源，
;     杂项不变）。判据全部**离线取证**（Starfield.esm，见 docs/16）：
;       武器、投掷物          = WEAP（手雷/地雷在数据里也是 WEAP）
;       太空服、背包、头盔、服饰 = ARMO
;       弹药、救援            = AMMO + ALCH（含食品 / 饮料）
;       笔记                  = BOOK（便条 / 数据板 / 杂志 / 书）
;       资源                  = MISC + `ResourceType*` 关键词（铁/铝/氦-3 …）
;       杂项（**不变**）      = 其余 MISC + 钥匙（KEYM）
;
;  ★★ 实测的 11 个状态原生配色（1.16.244.0；`outline colors[...]` 日志直读）：
;
;      状态  名字                颜色
;      ----  ------------------  ------------------------------------
;        0   Generic             青      ( 62,173,242)
;        1   Scanned             淡蓝白  (179,193,239)
;        2   FullyScanned        蓝      ( 31,142,226)
;        3   Tracked             蓝      ( 31,142,226)  ← 与 2 完全相同
;        4   Bounty              绿      ( 39,198,132)  ← ★★★ v4.24：与 5 一起**归还引擎**
;        5   Social              绿      ( 39,198,132)      （引擎画「已扫描的星球目标」
;                                                            用的就是这一对：近 5 / 远 4）
;        6   TargetGeneric       蓝      ( 31,142,226)  ← 与 2 完全相同
;        7   TargetScannable     基色 alpha=0（**不填充**，只画脉冲轮廓）
;                                脉冲 High #72E8FF / Low #115B69 = **原版扫描仪的青色**
;        8   TargetScanned       与 7 完全相同（★ 原版扫描目标用的就是这一对槽位）
;        9   TargetFullyScanned  橙      (255,170,  0)
;       10   (?)                 红      (255,  0,  0)
;
;  ⇒ 原生配色里视觉上区分得开的只有 **6 种**（青/淡蓝白/蓝/绿/橙/红），而且
;     state 0/1/2/3 全是蓝色系（青 / 淡蓝白 / 蓝 / 蓝）—— 用户实测反馈就是
;     「地上放的武器、太空服、数据板看起来是同一个颜色」。
;
;  ★★★ v4.19：**颜色不再依赖状态的「原生值」**，改成「每个类别一个自定义色」
;     （写进引擎每状态的**配色块**：+0x00/+0x20 脉冲色、+0x80 描边基色）。
;  ★★★ v4.22 / v4.24：**state 7/8 与 4/5 都归还给原版扫描仪**：
;        武器、投掷物  0  →  红    #FF2E2E        太空服等      1  →  品红 #FF3BD4
;        弹药、救援    5  →  **原版色**（不覆盖） 笔记          6  →  黄   #FFD700
;        资源          3  →  紫    #B36BFF        杂项          2  →  蓝   #1F8EE2（原生，不变）
;        容器 / 尸体   9  →  橙    #FF9500        设备          4  →  **原版色**（不覆盖）
;        门            10 →  白    #FFFFFF        植物 / 矿脉    7  →  **原版色**（不覆盖）
;        其它(MSTT)    2  →  不覆盖（与杂项同 state 同蓝；该类别默认关）
;        7 / 8         →  **颜色不覆盖，留给原版**（原版扫描仪的 TargetScannable /
;                          TargetScanned —— 星球目标的「扫描前」= 青色脉冲轮廓就是它们）
;        4 / 5         →  **颜色不覆盖，留给原版**（★ v4.24：引擎把「**已经扫描过**」的
;                          星球目标写进这两个槽位，原生色 = **绿色 #27C684** —— 也就是
;                          用户说的「原版扫描后的绿色」；证据链见 docs/23）
;     ⇒ 六个物品组占据六个相隔 ≥44° 的色相，肉眼一眼能分（选色理由见 docs/18；
;     7/8 归还的推导见 docs/21）。
;       ★ v4.24 起：「设备」= 原版绿（state 4）、「弹药救援」= 原版绿（state 5）。
;         想给这两类自定义色 ⇒ 写 ColorDevice / ColorAmmoAid，**代价是原版扫描后的
;         绿色会被盖掉**（远的已扫描目标变 ColorDevice、近的变 ColorAmmoAid）。
;       **默认色写在 DLL 里，不写 INI 也生效**（想改才写文件末尾的 ColorXxx）。
;    ★ 注意：**共享同一个 state 的两个类别必须同色**（容器+尸体 = 9），
;      否则后写的会盖掉前面的（DLL 日志里有撞色 WARN）。
;
;  ★★★ v4.23（两条用户实测反馈的正面回答，推导见 docs/22）：
;     ① 「星球上的矿石、气体、液体、植物、动物现在颜色完全不显示了」
;        ⇒ 「植物」类别**重新默认开**，但 state 用 **7（原版 TargetScannable）**、
;          颜色**不覆盖** ⇒ 不举扫描仪时星球上的矿脉 / 气泉 / 液池 / 植物
;          一直是**原版那个青色脉冲轮廓**（不是 MOD 自造色）；
;          举着扫描仪时 **YieldTargetsWhileScanning=1** 让位原版（这一类不重申）⇒
;          「扫描前 / 扫描后 / 正在扫描」的原版状态与颜色一个都不被盖。
;     ② 「资源和杂物还是无法区分」⇒ 订正 **BSTArray 布局**（见 ResourceByKeyword
;        那一节）：旧代码把 `data` 读在 +0 上（真值 = size），于是**任何 MISC 都
;        判不出资源** ⇒ 资源全程静默归杂项。现在布局 = size@+0 / capacity@+4 /
;        data@+8，并带偏移自适应与 `关键词数组标定 = base+0x…` 一行日志可核对。
;
;  ★★★ v4.24（用户实测反馈的正面回答，证据链见 docs/23）：
;     「矿石、气体、液体、植物、动物现在颜色扫描前是原版颜色，但是举起扫描仪
;       扫描的颜色不是原版，而且扫描后，没有变成原版扫描后的绿色」
;     ⇒ **真根因：state 4 / 5 这两个槽位被 MOD 覆盖了** —— 反汇编引擎的扫描求值
;       函数（RVA `0x159ED90`）可以看到：对星球目标（base = **FLOR**，含植物与
;       `MineralDeposit*` 矿脉 / 气泉 / 液池），引擎会顺着
;         FLOR+0x260（`TESProduceForm::produceItem`，一个 **LVLI**）→ 首个条目
;         （**MISC**）→ MISC+0x238（`BGSCraftingResourceOwner` 的 24 字节三元组
;         数组）→ 取 **BGSResource（IRES，formType 0x9F）** → 调 `0x1597A50(irES)`
;         =「这个资源是不是已经扫描过（进了勘测数据）」
;       命中 ⇒ `add edx,4`（0x159F562 / 0x159F4AF）⇒ 写 **state 4（远）/ 5（近）**；
;       而这两个槽位的**原生色就是绿色 #27C684**（`outline colors[install]` 那 11 行
;       里 state=4 Bounty / state=5 Social）—— 就是原版「扫描后变绿」的那一对槽位。
;       v4.19~v4.23 把 4 覆盖成「设备 青 #00E5FF」、5 覆盖成「弹药救援 亮绿 #00FF66」
;       ⇒ 扫描过的星球目标显示成青色（远）/ 亮绿（近），永远看不到原版绿。
;     ⇒ 修法：**4 / 5 的颜色一个字节都不写**（与 v4.22 归还 7/8 同一个道理）；
;       「设备」「弹药救援」继续用这两个槽位（分类逻辑不变），颜色 = 原版绿 #27C684。
;     ⇒ 新增诊断键 `ManagerOccupancyProbe`（默认 1，见下）：每次「举起扫描仪」1.5 秒后
;       打一行 `manager occupancy[举着扫描仪]: 0=… 1=… … 10=…` —— 直接看引擎在往哪些
;       槽位写（4/5 涨起来 = 已扫描的星球目标真的在用它们）。
;
;  ★★★ v4.25（用户实测反馈的正面回答，证据链见 docs/24）：
;     「矿石、气体、液体、植物、动物现在扫描后，在扫描仪里的颜色是原版颜色了，
;       但是收起扫描以后，在 mod 的高亮颜色里还是扫描前的原版蓝色，
;       这个也要跟着一起变成原版绿色」
;     ⇒ v4.24 修的是**举着扫描仪时**那一半（4/5 归还引擎）；这一版修**放下扫描仪
;       之后**那一半 —— MOD 自己重挂时也要区分「扫没扫过」：
;         · 已扫描 ⇒ `StateFloraScanned`（默认 **5**，原生绿 #27C684）；
;         · 未扫描 ⇒ `StateFlora`（7，原版青色脉冲）。
;       判据 = **引擎自己那一个函数**（`0x1597A50`「该资源是否已进勘测数据」），
;       MOD 照抄引擎那条链（FLOR → LVLI → MISC → IRES）再调它 ⇒ 与原版逐字节一致。
;       开关 / 状态：`FloraScannedByResource` / `StateFloraScanned`（见下面那两节）；
;       日志里 `flora scan:` 每个 base 一行、统计行 `planet targets (窗口内): …`
;       一眼能看出分流是否生效。
;
;  ★★★ v4.28（用户实测反馈的修复，证据链见 docs/26）：
;     「植物颜色错误，扫描前也显示成了扫描后的颜色，矿石、动物是好的」
;     ⇒ **真根因：植物不该走那条资源链**。引擎的扫描求值函数 `0x159ED90` 在
;       走资源链之前有一条硬判据：
;           0159F4F1  cmp byte [rax+0x2E], 0x3F   ; 「产出物品」字段必须是 **LVLI**
;           0159F4F5  jne 0x159F57F               ; ★ 不是 LVLI ⇒ 整段跳过
;       而**植物的产出物品是 MISC**（如 `FloraBiomeForestConiferous08` →
;       MISC `OrgCommonFiber`），只有**矿脉 / 气泉 / 液池**（`MineralDeposit*`）
;       的产出才是 LVLI ⇒ v4.25~v4.27 放行 MISC，等于「拿植物产出的资源去判
;       植物扫没扫过」：只要那个资源（有机纤维之类）进过勘测数据，
;       **没扫描过的植物也被判成「已扫描」⇒ 显示成绿色**（= 用户看到的现象；
;       矿石 / 气体 / 液体一直是对的，正因为它们的产出是 LVLI）。
;     ⇒ v4.28 两条改动：
;       ① **主判据换成引擎自己的 `ScannableComponent::GetOutlineState(ref)`**
;          （1 = 未扫描 / 2 = 已扫描；引擎自己的原生函数 `IsScanned` 就是它 == 2，
;           见 docs/26 §1）—— 它按**引用**回答（引擎内部按 species / resource 解析
;           canonical id），植物 / 矿脉 / 气泉 / 液池一视同仁；
;          开关：`FloraScannedByEngineState`（默认 1）。
;       ② **资源链只对「产出物品是 LVLI」的 FLOR 生效**（与引擎逐字节同口径）——
;          植物不再走它。开关仍是 `FloraScannedByResource`。
;       判据顺序：① 引擎状态 → ② 引擎亲手画过的绿（举着扫描仪时学到，会话内有效）
;       → ③ 资源链。三条任一命中即「已扫描」（= 原版绿）。
;       日志：`flora scan: … | 引擎状态=N | …`（每引用一条，≤FloraScanProbeMax），
;       统计行 `planet targets (窗口内): … | 引擎状态: 问=… 已扫描=… 未扫描=… … ready=1/1`。
;
;  ★★ 覆盖颜色的**副作用**（如实记录，推导见 docs/16 §配色 / docs/21 / docs/23）：
;     · **state 7 / 8 的颜色永不覆盖**（v4.22 起）—— 原版扫描仪在星球上扫「矿石 /
;       气体 / 液体 / 植物 / 动物」时写的就是这两个状态，覆盖它们 = 扫描前后
;       再也分不出来（用户实测反馈的就是这个）。v4.23 起我们**借用** state 7 的
;       原生色来画「不举扫描仪时的星球目标」，仍然一个字节都不改它的颜色。
;     · **state 4 / 5 的颜色永不覆盖**（★ v4.24 起）—— 引擎把「**已扫描**」的星球
;       目标写进这两个槽位（近 = 5 / 远 = 4），原生绿 #27C684 就是原版「扫描后
;       变绿」；覆盖它们 = 扫描后永远看不到那个绿（用户实测反馈的就是这个）。
;     · ★★★ v4.25：**state 5 多了一个使用者** —— 「已扫描的星球目标」（MOD 侧，
;       见 `StateFloraScanned`）。它与「弹药、救援」共用 5：两者**必须是原版绿**
;       才不打架，所以默认都不覆盖颜色；若你写了 `ColorAmmoAid=00FF66`，那
;       「已扫描的星球目标」也会一起变成亮绿（同一个槽位、同一个颜色块）。
;       想避开这条耦合 ⇒ `StateFloraScanned=4`（原版绿，与「设备」共用；同样
;       受 `ColorDevice` 影响）或 7（等于不区分，退回 v4.24 观感）。
;     · 仍被覆盖的引擎状态（★ 2026-09-28 定稿口径）：2（杂项，写的**就是原生色**
;       ⇒ 观感不变）、3（笔记 / 资源，原生蓝 → 紫）、6（门，原生蓝 → **品红
