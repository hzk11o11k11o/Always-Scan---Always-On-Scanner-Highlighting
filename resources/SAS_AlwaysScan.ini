; ---------------------------------------------------------------------------
;  ★★ v4.17：「资源」判据 —— MISC 记录上的 `ResourceType*` 关键词（默认 1）
; ---------------------------------------------------------------------------
; 1 = 读物品记录的**关键词**来判断「这是资源还是杂项」（离线实证见 docs/16）：
;       · 1319 条 MISC 里 **410 条**带 `ResourceType*`（= 铁 / 铝 / 氦-3 这类
;         资源物品），909 条不带（Digipick / Credits / 毛绒玩具 / 盆栽 …= 杂项）；
;       · 带的是 28 个 `ResourceType*` 关键词（ResourceTypeSolid / Gas /
;         Liquid / Organic / Crafting* / Manufactured* / Fauna / Flora …）。
;
; ★ 启动自检（日志里搜 `resource keyword:`）：DLL 会拿**已知答案**的原版记录验一次
;   （正样本池 = 铁 / 铅 / 镍 / 钨 / 钛 / 铂 / 烷烃这些资源物品，任一命中即通过；
;     反样本 = Digipick、Credits，必须不命中）。
;   ★★★ v4.22 重做：**自检不再「卡住」资源分类** ——
;     实测 `InorgCommonIron`(0x5556E) 整局都 `LookupByID` 拿不到（121 次尝试全 null，
;     而 Digipick/Credits 一次就拿到）⇒ 旧版「拿不到样本就不生效」把「资源」**静默**
;     冻在「杂项」上，用户看到的就是「资源和杂物同色（都是原版扫描仪的蓝色）」。
;     现在：**默认生效**（读法本身有三层形状校验，最坏只是「资源归杂项」，不会误判），
;     只有拿到**明确反证**（反样本命中 / ≥2 个正样本都不命中）才否决。
;     判定通过后日志会打 `首个资源命中 base=0x… -> 资源分类生效`（这是「资源真在干活」的
;     最直接证据；星球上或捡到资源物品时不一会儿就会出现）。
;
;   ★★★ v4.23 **真根因订正**（用户实测：v4.22 那一局 46 条统计行里 `resource=` 恒为 0）：
;     读法本身错了 —— 旧的 `IsResourceBaseRaw` 按「`data@+0 / size@+8 / capacity@+0xC`」
;     读 `BSTArray`，而 commonlibsf `BSTArray.h` 的真实布局是：
;         BSTArrayBase { _size@+0x00, _capacity@+0x04 }（第 52 行）
;         BSTArray : BSTArrayBase, Allocator { …; void* _data@+0x08 }（第 136/380 行）
;     ⇒ 旧代码把 `data` 读成了 `size | capacity<<32`（一个几万的小整数），
;       `IsPlausiblePointer` 必然否掉 ⇒ **任何 MISC 都判不出资源**，全程静默归杂项。
;     现在：布局订正为 **size@+0 / capacity@+4 / data@+8**（= 同文件 cell 引用数组
;     一直在用的那一套），并且**偏移自适应**（候选 0x208/0x200/0x1F8/0x210/0x218，
;     形状全过才采纳并缓存）。日志里搜这两行即可核对：
;       · `resource keyword: 关键词数组标定 = base+0x208（… n=… kw=[…]）` —— 找到读法；
;       · `misc kw probe: base=0x… 候选偏移全不合格 …` —— 5 个候选都不对（发出来即可定位）。
; 完整证据链见 docs/22 §一。
; 0 = 不读关键词（全部 MISC 都算「杂项」= 1.5 的行为）—— 只在排查
;     「资源颜色不对」时用，不用换 DLL。
ResourceByKeyword=1

; ---------------------------------------------------------------------------
;  ★ v4.2 / ★★ v4.4：尸体高亮 + 「搜空即熄灭」
; ---------------------------------------------------------------------------
; 判死（任一成立就算「可搜刮的尸体」）：
;
;   ★★ v4.4 新增的**主判据 = 引擎自己的 lifeState 枚举**（推荐保持开着）：
;       `[Actor+0xF8]` 的 bits17..20 是一个 4 位枚举，而 Papyrus 的
;       `IsDead() / IsUnconscious() / IsBleedingOut()` 读的全是它 —— 反汇编实证：
;         · IsDead()        ⇒ lifeState ∈ {1, 2, 5}
;         · IsUnconscious() ⇒ lifeState == 3
;         · IsBleedingOut() ⇒ lifeState ∈ {7, 8}
;       为什么必须换成它：**kDead 位不可靠** —— v4.3 实测 450 次尸体判定里
;       一个都没读到 kDead 位（上一代项目也撞过同一堵墙），于是「打死的敌人
;       有东西却不亮」。现在直接读引擎判死用的那个枚举，与引擎完全一致。
;   ① **运行时 kDead 位**            —— 保留为保险（那条路依然成立）；
;   ② **记录标志 Starts Dead(0x200)** —— 预置尸体：离线实证 9 530 个 ACHR 里 2 283 个带它，
;      样本有 Loot_Corpse_MinerM_Fresh01 / SE_KT14_*_Corpse / UC_NA_TopherCorpse，
;      以及 **Biome_Prey_Corpse / Biome_Critter_Corpse（星球生物尸体）** ⇒ 人类与怪物一视同仁；
;   ③ **记录标志 Starts Unconscious(0x2000)** —— 炮塔 / 机器人的报废体、倒地可搜刮者
;      （★ v4.2.1 起默认参与，想排除见下面 CorpseUnconscious）。
; 判活 = 活着的 NPC / 生物**一个都不亮**（红线，lifeState = 0）。
;
; 1 = 读引擎 lifeState：把「引擎判定为死亡（1/2/5）」的 ACHR 当尸体点亮。默认 1。
;   ★ 这就是「打死的敌人 / 生物 / 机器人」被点亮所依赖的那条路。
;   设 0 = 退回 v4.3 行为（只看 kDead 位 + 两个记录标志）。
CorpseLifeState=1
;
; 1 = 把 lifeState ∈ {7, 8}（引擎 `IsBleedingOut()` = **倒地出血 / 濒死**）的也算尸体。
;   默认 1。依据：这类单位在游戏里就是**可以搜刮的倒地者**（上一代项目的
;   `IsDead() ∨ IsUnconscious() ∨ IsBleedingOut()` 判据经用户实测有效）。
;   想严格一点（只认 1/2/5）就设 0。
CorpseBleedout=1
;
; 1 = 连「Starts Unconscious（0x2000，倒地 / 停机 / 昏迷）」的也当尸体点亮。
;
;  ★★ 默认 1（v4.2.1 用户要求）：这一位在数据里**主要是炮塔 / 机器人的报废体** ——
;     离线统计：193 条引用 / 26 个唯一 base，其中 **22 个是机器**：
;       LvlRobotModelA_*（工业/战斗/Aggro/SysDef/Starborn/Varuun…）、
;       LvlTurretShort_* / LvlTurretCompact / LvlTurretQuadrapod、
;       LvlMiniBotA_Base_Clean、JasminesRobot、LvlSecurity_UC、RL012_LvlTurretCompact …
;     这些就是玩家说的「**炮塔 / 机器人尸体**」，走近能搜刮（拿空后同样熄灭）。
;
;  ⚠️ 代价（如实说明）：另外 4 个 base 是活物 —— MS01WoundedSoldier /
;     MS01WoundedScientist（任务里受伤倒地的两人）、LvlCitizen_UC_Male、
;     RL039_LvlSwarmerCritter。它们倒地/昏迷时点亮是合理的（能搜刮），
;     万一遇到「站起来后还亮着」，把这里改成 0 即可（**不用换 DLL**）。
;
;  ★ v4.4：这个开关**同时**管 `lifeState == 3`（引擎 `IsUnconscious()` =
;     昏迷 / 停机报废体）—— 与「Starts Unconscious 记录标志」是同一类东西。
CorpseUnconscious=1

; 1 = 容器 / 尸体「库存为空」就不高亮（**搜空即熄灭**）。默认 1。
;   物品拿光后约 1.5 秒（UnhighlightGraceMs）熄灭。
;   ★ 它依赖「库存列表」位置的运行时标定（样本 = 容器或 ACHR，做形状校验）：
;     标定成功 → 日志 `inventory calibration: off=+0xA0 ok=… strong=… -> 搜空判空**启用**`；
;     还没成功 → `… 仍在攒样本（rounds=… checks=…）… -> 搜空判空**暂不可用**`
;       （不判空，容器 / 尸体照常亮，**不会崩**；攒够样本会自动启用）。
;   ★ v4.3 起标定是**跨轮攒样本、永不放弃**（前 40 轮每轮都试，之后每 4 秒试一次）：
;     开局在太空 / 飞船里没有样本也没关系，落地 / 进屋后会自然标定成功。
;   ★ 判定是「所有物品条目的 stack 数量之和为 0」——不是只看条目数，
;     因为引擎拿光物品后**可能留下 count = 0 的空条目**，只看条目数会永远亮着。
SkipEmptyLoot=1
;
; ★★ v4.5：判空时**跳过「非玩家物品」**（记录标志 0x04 = Non-Playable）。默认 1。
;
;   背景（这是「拿空还亮」的真根因，2026-09-18 实测取证）：
;     NPC 尸体身上永远穿着几个 **`*_NOTPLAYABLE` 的隐形装备**
;     （如 `Spacesuit_Assault_01_NOTPLAYABLE` / `Spacesuit_Assault_Backpack_01_NoBoostpack_NOTPLAYABLE` /
;      `Clothes_ScienceLabTec_CORPSE_FROZEN_NOTPLAYABLE`）。它们：
;       · **玩家拿不走**；· **搜刮面板里不显示**；· 记录标志 bit2（0x04）被置位。
;     而同一件装备的玩家版（`Spacesuit_Assault_01` 等）**不含** 0x04 —— 离线对照过：
;       0x192294=0x44（NPC 版） vs 0x2265AD=0x40（玩家版）；
;       0x12AAC6=0x44（NPC 版） vs 0x169F59=0x40（玩家版）。
;     可拿物品实测都是 0x00：`Credits`、`Digipick`、弹药、食物。
;
;   ⇒ 你把面板里的东西全拿光（面板显示空），库存里这些 0x04 条目的数量仍然 > 0，
;     于是判空一直返回「有东西」⇒ **描边永不熄灭**（预置尸体 / 打死的敌人一样）。
;   ⇒ 打开这个开关后：这些条目不计入「有东西」⇒ 面板拿空即熄灭。
;
;   什么时候需要设 0：只有当某件**你确实能拿走**的物品也被 0x04 误伤时
;   （表现为「有东西的尸体不亮」），此时把它设 0 退回旧行为，并把日志发作者分析。
SkipNonPlayableLoot=1
;
; ★★ v4.6：判空时**同样跳过「正穿在身上的装备」**（`BGSInventoryItem::flags` 低 3 位
;   kSlotMask ≠ 0）。默认 1。
;
;   这是「活体敌人的尸体拿空了还不熄灭」的根因（v4.5 之后剩下的那一半）：
;     引擎的规则是「**只有被掉落 / 卸下的物品（fl=0）才进搜刮面板**」；还穿在尸体
;     身上的（fl≠0）面板不显示、玩家也拿不走，可 `count` 永远 ≥ 1。
;     而**穿在身上的装备有两种记录**：
;       · `*_NOTPLAYABLE`（记录标志含 0x04）—— 预置尸体多用这种（v4.5 已跳过）；
;       · **玩家版装备（记录标志 0x40）** —— 活着被打死的敌人多用这种
;         （实测样本：`Spacesuit_CrimsonFleet_Assault` / `..._Helmet` / `..._Backpack`
;          整套，日志里 `fl=1 ff=40`）⇒ v4.5 没跳过它们 ⇒ 拿空后一直亮。
;   ⇒ 打开这个开关后：`fl≠0` 的条目不计入「有东西」⇒ 面板拿空即熄灭。
;
;   ★ 旁证：第三方 mod `SimpleImmersiveLooting`（Nexus 12677）的「扒取装备」=
;     `Actor.UnequipAll()` —— 先把身上装备**卸下来**，面板里才能拿走；并且它把
;     `fEquippedArmorChanceToDrop` 从 0.1 覆盖成 0.0（= 死亡时引擎不再自动掉落
;     身上装备）。⇒ 装它的话：卸下（fl 归零）后本 MOD 会自动重新把尸体算作
;     「有东西」并照常高亮，直到你把它们拿走 ⇒ 两件事天然一致。
;
;   什么时候需要设 0：只有当你**确认自己能从尸体面板里拿走某件 `fl≠0` 的东西**、
;   而它导致「拿空不熄灭」时（把它设 0 退回旧行为，并把日志发作者分析）。
SkipEquippedLoot=1
;
; ---------------------------------------------------------------------------
; ★★ v4.9：**展示柜容器不判空**（武器箱 / 武器架 / 头盔架 / 背包架…）—— 默认 1
; ---------------------------------------------------------------------------
; 背景（用户实测）：*「武器箱关闭的时候没有高亮，只有打开的时候才开始高亮」*。
; 日志（`cont probe:`）+ 离线数据把原因定死了：
;   · 武器箱（base = `Loot_Display_WeaponsCase_Rifles_Common` 这类**展示柜**）的
;     内容**只在搜刮界面打开期间**以「临时条目」（`fl` 的 bit5 = kTemporary）投影
;     进库存列表，关掉界面就收走 ⇒ 关闭状态下判空读到 size=0；
;   · 于是「读到空 ⇒ 熄灭」的规则让**关着的武器箱永远不亮**，一打开才亮。
; ⇒ 本 MOD 对「展示柜」容器跳过判空：读到「空」也照常亮（打开状态下照旧按实际
;   投影判空 —— 打开着被发现是空的同样会熄灭）。
;
;   识别方式（两者取或）：
;     ① 静态白名单 `SasDisplayCases.h`（由 tools/re/gen_display_cases.py 从
;        Starfield.esm 生成：707 个容器里带 `BGSDisplayCase` 组件的 118 个）；
;     ② 运行期学习 —— 任何容器只要在打开期间读到过 kTemporary 条目，就把它的
;        base 记进内存（覆盖第三方 mod 新增的展示柜；本会话有效）。
;
;   已知副作用（如实记录）：展示柜被拿空后**关着也会亮** —— 关闭状态下它的库存
;   里什么都没有，与「从没打开过」在数据上无法区分。★ v4.10 已修掉这一条
;   （见下面 DisplayCaseUiEmpty）。
;   ⇒ 把这一项设 0 = 完全退回 v4.8 之前的行为（展示柜也按库存判空、关着不亮），
;   不用换 DLL。
SkipDisplayCaseEmpty=1

; ---------------------------------------------------------------------------
;  ★★ v4.10：展示柜「拿空即灭」—— 用「容器界面的同一段打开期」区分两种「空」（默认 1）
; ---------------------------------------------------------------------------
; v4.9 让展示柜「关着也亮」的代价是「拿空后也一直亮」（当时如实记录的副作用）。
; v4.10 引入一个**独立于库存的信号**：容器（搜刮）界面此刻是不是开着。
;
;   · **同一段打开期**里读到的「空」= 内容被拿光 ⇒ 判空（熄灭；关掉后靠粘性保持熄灭）；
;   · **关闭状态**（或从没打开过）读到的「空」= 内容未知 ⇒ 照常亮（= v4.9 的目标）；
;   · 一旦判空过、之后又往里放东西（转移）⇒ 重新按「有东西」亮。
;
;   判据来源（游戏自带脚本实证）：容器界面的菜单名 = `ContainerMenu` ——
;   `AudioContainerNoAnimScript`（容器开/关音效）与 `OutpostContainerScript`
;   （「打开就进 busy、关掉再结算」）都用 `RegisterForMenuOpenCloseEvent("ContainerMenu")`。
;
;   ★ 你会在什么时候需要把它改成 0：想临时对照 v4.9 的行为（展示柜拿空后仍亮），
;   或怀疑某类第三方展示柜的判定不合意时。设 0 = 退回 v4.9，不用换 DLL。
DisplayCaseUiEmpty=1

; ★ v4.10：容器（搜刮）界面的菜单名（一般留默认即可）
;   默认 `ContainerMenu` 是游戏自带脚本实证过的名字。只有在你装了会改容器菜单名的
;   第三方 UI / 框架、导致「展示柜拿空后不熄灭」时，才需要改成实际的名字。
ContainerMenuName=ContainerMenu

; ---------------------------------------------------------------------------
;  ★★ v4.11 / v4.12：容器界面信号改走**引擎自己的菜单事件**（默认 1）
; ---------------------------------------------------------------------------
;   ★ v4.13 更正（重要）：这一整套的前提（「搜刮面板 = 一个 UI 菜单」）**不成立** ——
;     v4.12 的日志证明面板开着时没有任何 `ContainerMenu` 事件、`IsMenuOpen` 里也只有
;     HUD 那两个菜单。所以下面这几个键**对「快速搜刮面板」不产生作用**，留着只为
;     「万一某个真菜单（例如前哨的容器界面）开了」这一种情形与排错对照；
;     真正干活的换成了本文件末尾的 **v4.13 那两个游戏事件**。
;
; v4.10 实测（用户报「武器箱拿空后还是不会熄灭」）暴露了一个问题：**轮询**
; `RE::UI::IsMenuOpen("ContainerMenu")` 在游戏里**全程读到 0**（连「搜刮界面确实
; 开着、库存里都能看到投影条目」的那些时刻也是 0）⇒ 「同一段打开期」判据从未生效。
; 菜单名本身没有错（`Starfield.exe` 的菜单名表里有它、界面归档里有 containermenu.swf）
; —— 是这条路读不到它。
;
; v4.11 因此叠了一条**引擎自己发**的路：`RE::UI` 本身就是「菜单开/关事件」的事件源
; （基类在 `UI + 0x20`），注册一个 sink 收它的事件（带菜单名 + 开/关），并用它驱动
; 「容器界面开着吗」。注册前做 vtable 硬核对（确认那个地址真的是
; `BSTEventSource<MenuOpenCloseEvent>`），核对不过就**不注册**、退回轮询
; （绝不往不明来源上挂回调）。
;
;   ★ v4.12 订正：v4.11 那个「期望 vtable RVA」算错了（0x5CCADD0 其实是另一个类型的
;     TypeDescriptor），于是 sink 一次都没挂上（日志里每 4 秒一条「不注册」WARN）。
;     正确值 = **0x4D7E3D8**：证据是 **UI 构造函数里那一串 vtable 写入**
;     （`mov [rcx+0x20], <0x4D7E3D8>`，偏移与 commonlibsf 的基类表逐条吻合），
;     且该 vtable 的首槽是 `sub rcx,0x20; jmp …`（子对象位于 +0x20 的析构 thunk）。
;     v4.12 另加三条保险：**按 vtable 指纹找事件源**（UI+0x20 对不上就往后扫）、
;     **每 60 秒核对 sink 还在不在**（UI 重建时自动补挂）、vtable 对不上时打一行
;     「UI 布局指纹」便于离线对照。
;
;   ★ 设 0 = 只用轮询（v4.10 的行为，仅排查用）。
ContainerMenuEvents=1

; ★ v4.11：容器菜单名「自愈学习」（默认 1）
;   当 MOD 看到展示柜投影（= 搜刮界面确实开着）而界面标志还是 0 时，会把「此刻唯一
;   开着的、且不在忽略名单里」的菜单名学成容器菜单名（本会话有效）——原版 / 第三方
;   改过菜单名时靠它自愈。设 0 = 只写诊断日志、不学习。
ContainerMenuLearn=1

; ★ v4.11（诊断）：「此刻开着的菜单」快照最多打几次（默认 6；0 = 关掉）
;   只在「看到展示柜投影却没有界面标志」时打，一次就能看出真正的菜单名是什么。
MenuDumpMax=6

; ★ v4.11 / v4.12（诊断）：普通菜单事件最多写多少条日志（默认 48；0 = 只记容器相关的）
;   ★ v4.12：**每个菜单名的头 3 条一定记**（长会话里也一定能看到「都是哪些菜单在开关」——
;     v4.11 那轮是全局 48 条，玩久了额度就烧光，最关键的取证反而看不到）。
MenuEventLogMax=48

; ★ v4.11：展示柜**逐帧**观察（默认 1）
;   「拿空 ⇒ 立刻关掉」这件事可能只持续不到一个扫描节拍（默认 200ms）⇒ 200ms 的
;   采样会漏掉它。打开这一项后，半径 20m 内的展示柜会被**每帧**读一次库存，
;   观测窗口缩到 1 帧（约 16ms）。纯内存读，开销可忽略；设 0 = 退回只在扫描节拍上判。
DisplayCaseFrameWatch=1

; ★ v4.11（诊断）：展示柜「投影出现 / 消失」追踪日志上限（默认 24；0 = 关掉）
;   ★ v4.13：这一行末尾多了 `qo=`（快速面板会话开着吗）/ `take=`（这段打开期里收到过
;     拿走事件吗）/ `snap=`（内容快照条数）/ `emptyMs=`（连续空多久）—— 判据生效与否
;     看这一行就够了。
DisplayCaseTraceMax=24

; ---------------------------------------------------------------------------
;  ★★ v4.13：展示柜「拿空即灭」改用**引擎自己的游戏事件**（默认 1）
; ---------------------------------------------------------------------------
; 为什么又换（v4.10 轮询 / v4.11+v4.12 菜单事件都不行）：
;   v4.12 那一局的日志证明**快速搜刮面板根本不是 UI 菜单** —— 投影出现（= 面板开着）
;   的那一刻没有任何 `ContainerMenu` 事件，`IsMenuOpen` 快照里也只有 HUD 那两个。
;   所以「面板 = 菜单」这个前提不成立，前两条路注定读不到它。
;
; v4.13 换成两条**引擎自己发的游戏事件**（离线用 RTTI 链在 exe 的 229 个静态事件源里
; 找出来，注册前都会硬核对 vtable，不是那个类型就绝不注册）：
;   ① `TESContainerChangedEvent` —— 物品在容器之间移动（Papyrus `OnItemAdded` /
;      `OnItemRemoved` 背后就是它）。MOD 逐帧把展示柜的投影内容记成 `base -> 数量`
;      快照，一收到「从这个箱子拿走 X×N」就减账，**减到 0 ⇒ 判「拿空」**（粘性熄灭）。
;      ⇒ 拿空后立刻关掉、甚至同一个扫描间隔内关掉都不影响（v4.10 那个「已知窗口」没了）。
;   ② `QuickContainerOpenedEvent` —— 快速搜刮面板打开，负载里带着**是哪个箱子**。
;
;   设 0 = 两个事件都不注册（退回 v4.12 行为，仅排查用）。
ContainerLootEvents=1

; ★ v4.13 → ★ v4.14：兜底判据（**v4.14 起默认 0＝关闭**）
;   兜底 = 「快速面板确认为这个箱子开着」+「这一段打开期里读到过内容」+
;   「连续读到空 ≥ 400ms」⇒ 判「拿空」（只在记账一次都没生效过时才启用）。
;   ★★ 为什么 v4.14 默认关（实测 + 推导，两个误灭面）：
;     ① 「打开瞬间」：面板刚打开、投影还没建立的那 0.4~0.7 秒（展示柜关闭时库存本来
;        就是空的）会被当成「连续读到空」⇒ 一打开就误判拿空。
;        实证：2026-09-19 14:25:06 的日志 `display case emptied (兜底…)`，可那一刻
;        箱子里明明有 2 件东西（14:25:06.463 投影出现）。
;     ② 「打开看一眼、不拿、关掉」：关掉后投影消失、库存又读空，而「面板关闭」这件事
;        **没有任何信号**（拿空与关闭在数据上完全同形，v4.9 就论证过）⇒ 400ms 后必然
;        误判 ⇒ 关掉后箱子会（错误地）保持熄灭，直到再次打开它。这一类**修不了**。
;   ★ 取舍：真实拿空由**记账**（ContainerLootEvents）负责，已实测精确生效
;     （2026-09-19 那局 2 条 take 减账到 0）；「不走物品事件的展示柜」至今没有实测
;     证据 ⇒ 宁少灭、不误灭（项目红线）。
;   设 1 = 开回兜底（会重新带上 ② 的误灭风险；① 已由「这一段里读到过内容」挡住）。
DisplayCaseQuickOpenEmpty=0

; ★ v4.13（诊断）：物品事件 / 快速面板事件最多写多少条日志（默认 32；0 = 关掉）
;   每个 ref 最多 3 条。看 `loot event (take)/(put)/(quick open)` 这几行即可确认通道在工作。
LootEventLogMax=32

; ---------------------------------------------------------------------------
;  ★ v4.3 / ★ v4.4（诊断）：`actor probe:` —— 每个 ACHR 的判决明细（默认 24 条 / 次游戏）
; ---------------------------------------------------------------------------
; 每次启动游戏最多往日志里打这么多条「半径内 ACHR（不论死活）」的探针，内容：
;
;     actor probe: ref=… base=… d=…m formFlags=0x… boolBits=0x… lifeState=…
;                  dead=… startsDead=… startsUnc=… mh=… inv=ok/null loot=… -> 结论
;
;   · `dead / startsDead / startsUnc` = v4.3 的三个判死信号；
;   · `lifeState` = **引擎自己的生命状态枚举**（[Actor+0xF8] bits17..20）：
;        0 = 活着（红线：不亮）      1 / 2 / 5 = 死（引擎 IsDead）
;        3 = 昏迷 / 停机报废体        7 / 8 = 倒地出血（引擎 IsBleedingOut）
;     ★ v4.3 那个永远读不到的 `life=`（走 AIProcess 链路）已被它取代；
;   · `mh` = `IsBleedingOut()` 的第二个条件（出血动画标志，0/1，读不到 -1）——只作诊断；
;   · `inv / loot` = 库存指针（ok/null）与判空结果（1 有 / 0 空 / -1 未知 / -2 null）。
;
;   ★ 用途：报「某具尸体该亮却没亮」时，先在日志里搜 `actor probe:`
;     （按画面里的距离/名字对号入座）——一眼就能看出它是被判成了「活人」
;     还是「判空 = 空」，不用再猜。设 0 = 关掉这组探针（判决变化探针不受它限制）。
ActorProbeMax=24
;
; ★ v4.4：`actor probe (changed):` —— ACHR **判决发生变化**时才打（默认 32 条）。
;   这是定位「打死的敌人在引擎里变成了什么」的主力：打死的那一刻，日志里会出现
;   它当时的 boolBits / lifeState / StartsDead —— 从而分辨是「判死漏了」还是
;   「判空误判」。设 0 = 关掉。
ActorChangeProbeMax=32
;
; ★ v4.4 / ★ v4.5 / ★ v4.6：`loot probe:` —— 判到「有东西」的尸体，把**库存明细**打出来
;   （默认 16 条 / 次游戏；只对 20 米内的目标、每个引用只打一次）。内容：
;
;     loot probe: ref=… d=…m size=…（条目数）
;                 playable=…（**真能拿走**且有数量的条目数）total=…（它们的数量之和）
;                 equipped=…（**装备中**的条目数）eqTotal=…（它们的数量之和）
;                 nonPlayable=…（0x04 条目数）npTotal=…（它们的数量之和）
;                 [ft=类型 id=FormID n=stack数 c=数量 fl=条目flag ff=记录flag eq=0/1 np=0/1] …
;
;   · `ft`  = 物品的 formType（十六进制：22=ARMO护甲 / 28=MISC杂物 / 31=AMMO弹药 /
;             36=ALCH食物药品 / 35=KEYM钥匙 …）；
;   · `fl`  = 条目的 flags（低 3 位=装备槽，**非 0 = 还穿在身上**、bit3=装备锁定、
;             bit5=临时物品）；
;   · `ff`  = 物品记录自身的 flags（0x04 = 非玩家物品，见上面 SkipNonPlayableLoot）；
;   · `eq`  = 这一条是不是「装备中」（= `fl` 低 3 位 ≠ 0；见上面 SkipEquippedLoot）；
;   · `np`  = 这一条是不是「非玩家物品」（= ff 的 0x04）。
;
;   用途：「拿空了尸体还在高亮」时，这一行会**直接指出残留的是什么**。
;   判据：面板拿空后 `playable` 应变成 0 —— 剩下的应该全在 `eq=1` / `np=1` 两桶里
;         （它们都是面板拿不走的东西）。若 `playable` 仍 > 0，把这一行发给作者。
;   设 0 = 关掉（正常游戏不需要它）。
LootProbeMax=16
;
; ★ v4.8：`cont probe:` —— 容器（箱子）的「判空链路快照」（默认 64 条 / 次游戏；
;   只对 15 米内的容器打；每个容器打「首次快照」1 条 + 「判定结果变化」最多 2 条
;   —— 走到箱子旁 → 打开 → 关掉，正好给出前后对照）。内容：
;
;     cont probe: ref=… base=… d=…m loot=…（判定：1有东西 0空 -1未知 -2指针null -3未标定）
;                 size=…（库存数组里的条目数）keep=…(sum=…)（**算数**的可拿条目数与数量）
;                 withCount=…（数量>0 的条目数）sumRaw=…（所有条目数量之和）
;                 skipNp=… skipEq=…（因两条跳过规则被跳过的条目数）
;                 why=…（**判空原因**的一句话结论）
;                 [i=序号 ft=类型 id=FormID n=stack数 c=数量 fl=条目flag ff=记录flag eq= np= tp=] …
;
;   ★ v4.9：`cont probe` 行首的 `dc=1` = 该容器被判为「展示柜」（见上面
;     SkipDisplayCaseEmpty）；明细里的 `tp=1` = 该条目是 kTemporary（临时投影条目，
;     只在搜刮界面打开期间存在）—— 「关着 size=0、开着才有条目」就是这个特征。
;
;   ★ v4.11：展示柜后面跟着 5 个状态字段（「拿空即灭」卡在哪一步看它）：
;       ui=  「容器界面开着吗」（事件 ∨ 轮询的最终结果，判据用的就是它）
;       ev=  其中**事件侧**的判定（1 = 菜单事件说开着）
;       mEv= 本会话收到的菜单事件总数（0 = 事件通道没接上 ⇒ 看启动日志的 WARN）
;       st=  该展示柜的判决（0 未知 / 1 有东西 / 2 已确认拿空=粘性熄灭）
;       tpS= 这一段打开期里见过投影条目（判「拿空」的另一半条件）
;
;   用途：报「某个箱子**关着不亮、一打开（搜刮界面出来）就亮**」这类问题时，
;   走到那个箱子旁边（先别开），然后打开它、再关掉 —— 日志里会出现同一个
;   `ref=` 的两~三条记录（第二条起带 `(changed)` 后缀），把这几条发给作者即可定位。
;   设 0 = 关掉（正常游戏不需要它）。
ContProbeMax=64

; ---------------------------------------------------------------------------
;  ★ v4.3：库存指针为 null 时算不算「空」（默认 1 = 算空 ⇒ 不亮）
; ---------------------------------------------------------------------------
; 引擎给一个引用分配「库存列表」只有一条路（引用初始化时的虚函数
; `CreateInventoryList`，反汇编确认只有 1 个调用点）⇒ 指针是 null 就说明
; **它从来没有过库存** ⇒ 没有任何东西可搜刮 ⇒ 判「空」（不亮）是合理的。
;
; ★ 你会在什么时候需要把它改成 0：若遇到「一具从没搜过的尸体 / 一个从没开过的
;   箱子**不亮**」，而把这里设 0 之后就亮了 —— 说明引擎在某条我们没找到的路径上
;   会「懒创建」库存。改完重进游戏生效（不用换 DLL）。
TreatNullInvAsEmpty=1

; ---------------------------------------------------------------------------
;  ★ v4.0.1 / ★★ v4.19：自定义类别颜色（**默认值就是最终配色**，这里只是「想改才写」）
; ---------------------------------------------------------------------------
;  引擎为每个 outline 状态存了一整块参数，配色在里面（dword 布局 = **0xAARRGGBB**）：
;      +0x00 脉冲 High 色      +0x20 脉冲 Low 色
;      +0x40 float 插值除数    +0x60 float
;      +0x80 ★ 描边基色 —— **画出来的就是它**（v4.19 订正：以前写的那张表是错的）
;  想精确指定颜色就写 6 位十六进制 RGB；留空 = 用 DLL 里的默认色（见下面的注释）。
;
;  ★★★ 2026-09-28 的默认调色板（发布版 2.0.1；按 `颜色分类.md` 分组；
;      NPC / 星球目标保持原版色）：
;      ColorLoot=1F8EE2        杂项           —— 蓝（= 原生值，用户要求「不变」）
;      ColorWeapon=FF2E2E      武器、投掷物   —— 红（★ v4.31 起挂在 state 10）
;      ColorApparel=FF2E2E     太空服/背包/   —— ★★★ v4.32 **覆盖为红**（= 武器同色；
;                              头盔/服饰         state 10 与武器共用，整套装备一色）
;      ColorAmmoAid=（不写）    弹药、救援     —— ★★★ v4.24 **不覆盖**（原版绿 #27C684；
;                                                 写了会盖掉「已扫描的星球目标（近）」）
;      ColorNote=B36BFF        笔记           —— ★★★ v4.32 **覆盖为紫**（= 资源同色；
;                                                 state 3 与资源共用）
;      ColorResource=B36BFF    资源           —— 紫
;      ColorPickCredit=FFE100  开锁器、信用币 —— ★★★ 2026-09-28 **新增：黄**
;                                                 （通道模式专用；旧路径无空闲槽位）
;      ColorContainer=FF9500   容器           —— ★★★ v4.31 **覆盖为橙**（state 9）
;      ColorDevice=（不写）     设备/电脑/按钮 —— ★★★ 2026-09-28 第三轮：**通道默认 =
;                                                 原版绿 #27C684**（退回 2.0；
;                                                 旧路径 state 4 不覆盖 = 同色）
;      ColorDoor=FF3BD4        门             —— ★★★ v4.31 **覆盖**（state 6 =
;                                                 引擎唯一不写的槽位 ⇒ 对原版零影响；
;                                                 2026-09-28 第二轮：白 → 品红 #FF3BD4）
;      ColorFlora=（不写）      植物 / 矿脉    —— ★★ v4.23 **不覆盖**（用原版 state 7 的
;                                                 青色脉冲轮廓；写了就会盖掉原版色，
;                                                 详见 StateFlora 那一节的推导）
;      ColorCorpse=FF9500      尸体           —— ★★★ v4.31 **覆盖为橙**（= 容器）
;      ColorOther=             MSTT（默认关）—— 不覆盖（原生蓝）
;
;  ★★★ 2026-09-28 汇总（**通道模式 = 默认**）：每个类别一条独立通道 ⇒ 上表里
;     「并组」（武器+服饰、笔记+资源）只是**偏好**，想拆开直接改对应的 ColorXxx 即可
;     （不需要动 state、不会互相污染）；只有「植物 ↔ 原版」这条仍然保留（原版色优先）。
;     · 旧路径（ChannelMode=0 / 通道自动回退）：覆盖的仍是 **5 个槽位**
;       （2 = 杂项蓝、3 = 笔记 / 资源紫、6 = **门品红**、9 = 容器 / 尸体橙、
;        10 = 武器 / 投掷物 / 太空服 / 背包 / 头盔 / 服饰红）；state 0/1（活人 NPC /
;        通用目标）、4/5（已扫描的星球目标，「设备」与「弹药 / 救援」也在用它们但
;        **颜色不覆盖**）、7/8（未扫描的星球目标）全部归还引擎。
;       黄组在旧路径下没有槽位可用 ⇒ 与杂项同蓝（见 StatePickCredit 那一节）。
;
;  ★★ v4.21：**默认「不填充」** —— 描边基色写成 `RGB + alpha=0`（只留脉冲色 = 彩色轮廓），
;     物品本身的材质就透出来了。1.7.2 的 `AlphaXxx`（40% 不透明度）已被实测证伪：
;     用户截图量化显示整片覆盖区域的像素 stdev=1.1（40% 与 100% 逐像素相同）⇒
;     **alpha 根本不被渲染消费**，「不填充」才是「看得见材质」的正确做法
;     （引擎自己的原版扫描状态 7/8 就是基色 alpha=0）。
;     想回到「实心填充」（1.7.1 / 1.7.2 的行为）⇒ 写 `NoFill=0`（见下）。
;
;  ⚠️ 四点要知道：
;    ① 覆盖是**写引擎的全局配色块**，而原版手持扫描仪用的是同一套参数 ⇒ 同一个状态的
;       原版描边颜色也会跟着变（这是唯一能做到「精确指定颜色」的途径）。
;    ② 日志里会打 `outline colors: state=N 覆盖为 #RRGGBB <- 类别…`，
;       以及 11 个状态的实际值 `outline colors[install/world-ready] ...`
;       （`基色` = 画出来的颜色；后两列是脉冲两端）。
;    ③ ★ v4.21：描边基色一律写 **alpha=0（不填充）** ⇒ 物品上只有彩色轮廓，材质完好；
;       `NoFill=0` 时才回到「alpha=0 补 0xFF」的实心填充（1.7.1/1.7.2 行为）。
;    ④ ★ v4.19：同一状态被两个类别共用（容器+尸体 = 9，两者同色）时**必须同色**，
;       否则会互相覆盖；DLL 会打一条「共用 state 但颜色不同」的 WARN。
;    ⑤ ★★★ v4.23：**写 `ColorFlora` 会盖掉原版扫描目标的颜色**（state 7 是原版
;       `TargetScannable` 槽位）—— 除非你确实想自定义星球目标的颜色，否则别写它。
;    ⑥ ★★★ v4.24：**写 `ColorDevice` / `ColorAmmoAid` 会盖掉「扫描后变绿」**
;       （state 4/5 是引擎画「已扫描的星球目标」的槽位，原生绿 #27C684）——
;       写它们 = 远的已扫描目标变 ColorDevice、近的变 ColorAmmoAid。默认**不写**。
;    ⑦ ★★★ v4.30：**0/1 是引擎画「活人 NPC / 通用目标」的槽位**（远处 0 / 近处 1），
;       已默认归还引擎、任何类别都不再用（再用 = 行人跟着变色）。默认**不写**。
;    ⑧ ★★★ 2026-09-28（发布版 2.0.1）：**按「颜色分类」分组后的默认**（红 = 武器 /
;       投掷物 / 太空服 / 背包 / 头盔 / 服饰；橙 = 容器 / 尸体；紫 = 笔记 / 资源；
;       绿 = 弹药 / 救援 **+ 电脑 / 按钮等所有可互动物品（第三轮退回 2.0 = 原版绿；
;       第一 / 二轮曾与门同色：白 → 品红）**；**黄 = 开锁器 / 信用币**；
;       **品红 = 门**；青 / 绿（原版）= 星球上的矿物 / 植物）。
;       ★ 通道模式（默认）：`ColorXxx` 就是那条通道的颜色 ⇒ **想拆开某一组
;         （例：服饰单独一个颜色）直接改对应 ColorXxx 即可**，不需要动 StateXxx、
;         也不会污染任何别的类别 / 原版颜色（这是 v5.0 自建通道带来的自由）。
;       ★ 旧路径：覆盖仍是 2/3/6/9/10 五个槽位（设备 = 4 / 弹药救援 = 5，
;         都不覆盖 ⇒ 原版绿），`ColorApparel` / `ColorNote` / `ColorPickCredit`
;         的「独立」就不再成立（同槽必须同色）—— 想拆开就得让某个组换槽 / 换色
;         （docs/30 的槽位账本）。
;       （v4.31 的两个「让位互换」写法在 docs/29，已被取代。）
;
;  ▼ 下面是「默认生效的色值」（想改就直接取消注释并改）：
;     · 通道模式（默认）：每一项都只影响它自己那一条通道；
;     · 旧路径：`ColorAmmoAid` / `ColorDevice` 写了会盖掉星球目标的原版绿
;       （代价见上面 ⑥；2026-09-28 第三轮起设备退回 4 ⇒ ColorDevice 又会盖掉
;       「已扫描的星球目标（远）」，想避免就别写它）。
;ColorLoot=1F8EE2
;ColorWeapon=FF2E2E
;ColorApparel=FF2E2E
;ColorAmmoAid=00FF66
;ColorNote=B36BFF
;ColorResource=B36BFF
;ColorPickCredit=FFE100
;ColorContainer=FF9500
;ColorDoor=FF3BD4
;ColorDevice=27C684
;ColorFlora=00FF66
;ColorOther=
;ColorCorpse=FF9500

; ---------------------------------------------------------------------------
; ★★ v4.21：不填充（NoFill）——「看得见物品材质」的开关（默认开）
; ---------------------------------------------------------------------------
;  1 = 描边基色（引擎配色块 +0x80）写 `RGB + alpha=0` ⇒ **不填充**：物品上只有一层
;      **彩色轮廓 / 脉冲光**，物品本身的材质完好可见。这是 v4.21 的默认。
;      ★ 依据：引擎自己的原版扫描仪扫「可扫描目标」用的 state 7/8
;        （TargetScannable / TargetScanned），其描边基色就是 **0x00000000**（alpha=0），
;        也就是「不填充、只画轮廓」—— 原版扫描时物品材质是看得见的。
;  0 = 退回 1.7.1 / 1.7.2 的「实心填充」（基色 alpha=0 时补 0xFF）：颜色铺满整件物品，
;      更醒目，但会把材质盖住（就是说过的那句「连物品本身长什么样都不知道了」）。
;
;  ★ 1.7.2 引入的 AlphaXxx 已被实测证伪（对「覆盖深浅」逐像素无影响）——
;    现在它只影响**脉冲（轮廓）**的透明度；「看得见材质」请用本开关。
NoFill=1

; ---------------------------------------------------------------------------
; ★★★ v5.0：完全自建颜色通道（默认开）—— 2.0 的核心特性
; ---------------------------------------------------------------------------
; 背景（详见 docs/32）：原版引擎只有 11 条 outline 通道（state 0..10），其中 6 条
;   被引擎自己占用（NPC 通用青、星球目标青↔绿等），MOD 只能「借」剩下的 5 条 ⇒
;   类别被迫并组、覆盖颜色还会连带改掉原版扫描仪在同槽位上的颜色。
;
; 1 = 自建独立通道（**13 个类别各一条** + 「已扫描植物」一条 = **14 条**；
;     ★ 2026-09-28 类别 12 → 13：新增「开锁器 / 信用币」黄组）：
;     · 不写引擎的「引用→状态」表、不覆盖引擎配色块
;       ⇒ 原版扫描仪 / NPC / 星球目标颜色 100% 原版；
;     · 每个类别颜色互不干扰（想给武器和太空服不同色，分别写 ColorXxx 即可）；
;     · 引擎开关扫描仪（销毁它自己的 11 个管理器）也不会清掉 MOD 的高亮。
; 0 = 退回旧路径（1.8.1 / v4.33 行为：借 state 槽位 + 覆盖引擎配色块）。
;
; ★ 自建通道在「引擎版本变化导致签名不符 / 参数模板标定失败」时会**自动回退**
;   旧路径并打 WARN（日志里搜 `channel:`）—— 不需要手动改这个键。
ChannelMode=1

; 「植物已扫描」通道的颜色（自建通道模式专用；留空 = 原版绿 #27C684）。
; 未扫描的植物用 ColorFlora（默认原版青 #72E8FF），扫描过的用本键（默认绿）。
;ColorFloraScanned=27C684

; ---------------------------------------------------------------------------
; ★ v4.20 / v4.21 修订：脉冲不透明度（AlphaXxx，十进制 0~255）
; ---------------------------------------------------------------------------
;  只作用于**脉冲色**（配色块 +0x00/+0x20，= 描边上的彩色轮廓 / 呼吸光）。
;  ★ 它**不能**用来「让材质透出来」（1.7.2 实测：alpha 字节不被渲染消费）——
;    那个由上面的 `NoFill` 负责。
;
;  0   = 保留引擎原值（默认；脉冲 High 多为 FF、Low 多为 80，即原生呼吸感）
;  255 = 轮廓完全不透明（脉冲不再呼吸）
;  中间值 = 固定成该透明度。
;
;  ▼ 示例（写出来 = 与默认值一致，即「全部保留引擎原值」）：
;AlphaLoot=0
;AlphaWeapon=0
;AlphaApparel=0
;AlphaAmmoAid=0
;AlphaNote=0
;AlphaResource=0
;AlphaContainer=0
;AlphaDevice=0
;AlphaDoor=0
;AlphaFlora=0
;AlphaOther=0
;AlphaCorpse=0
;AlphaPickCredit=0

; ---------------------------------------------------------------------------
;  ★ v4.19：渲染侧参数探针（诊断，默认开）
; ---------------------------------------------------------------------------
;  1 = 每个会话最多 3 次，把「渲染器实际收到的每状态参数块」打进日志：
;      renderer params[stats]: state= 1 id=0x12 槽=12 基色=#FF3BD4 脉冲=#FF3BD4 f0=… f1=…
;      `基色` = 真正画出来的颜色 ⇒ 它应该等于上面配置的颜色；
;      若仍是原生值（青/淡蓝白/蓝…）说明管理器是在写表之前建的（重进游戏即可）。
;  0 = 关掉（不想要这几行日志时）。
RendererProbe=1

; ---------------------------------------------------------------------------
;  ★★★ v4.24：管理器占用探针（诊断，默认开）
; ---------------------------------------------------------------------------
;  1 = 每次**举起扫描仪** 1.5 秒后（引擎的求值循环至少写过一轮），打一行
;      11 个 outline 状态各自的元素数：
;        manager occupancy[举着扫描仪]: 0=5 1=2 2=7 … 4=3 5=9 … 10=1
;      用途：**直接看引擎在往哪些槽位写** —— 星球上扫描时 4/5（已扫描目标，
;      绿）与 7/8（未扫描目标，青）应该随扫描进度涨落；这也是 v4.24
;      「state 4/5 归还引擎」这条结论的实况验证方式（证据链见 docs/23）。
;      每个会话最多 6 行、全部只读，不影响任何行为。
;  0 = 关掉（不想要这几行日志时）。
ManagerOccupancyProbe=1

; ===========================================================================
;  视觉层其它
; ===========================================================================
; 每隔多少毫秒重新向引擎重申一次已挂的高亮（0 ~ 60000）。
;   ★ 0 = 不重申（默认）。高亮一旦挂上就一直有效（挂/摘都是本 MOD 自己在管），
;     周期性重申只会往引擎的高亮请求通道里灌重复请求，反而可能让描边
;     「一个一个慢慢出来」。只有观察到「高亮会莫名消失」时才打开（例如 5000）。
;   ★ v4.7 起「消失」这件事已经由下面的 `Verify3DPerScan` 定点处理（只在
;     真的发现 3D 被重建时才重挂），**一般不需要**再打开这个全量重申。
ReassertMs=0

; 1 = 引擎的高亮管理器不存在时，由本 MOD 调用引擎自己的重建函数把它们建出来
;     （不开扫描仪时引擎不会主动建）。0 = 不建（那就只在引擎自己建过之后才有高亮）。
; 除非排查问题，否则保持 1。
AutoEnsureManagers=1

; ===========================================================================
;  v3.2：用完原版手持扫描仪之后**自动重挂**
; ===========================================================================
; 1 = 玩家放下扫描仪（引擎里的 `MonocleMenu` 关闭）时，把已挂的高亮整批转入
;     「待重申」，按每轮 MaxOutlineOpsPerScan 条的预算重新挂一遍。
;
; ★ 为什么需要：引擎在扫描仪的开关过程中会拆掉扫描仪 HUD，而那个动作会
;   **销毁 11 个 HighlightManager + 清空「引用→状态」表**。于是本 MOD 内部
;   「已挂高亮」的账本全部变成悬空记录 —— 以为还挂着、引擎那边其实已经没了，
;   默认 ReassertMs=0 下不会自愈。
;   实测症状：用完原版扫描仪后高亮全灭，要按两下 F8（先关再开）才回来。
;
; 这条检测**不调用任何引擎函数**（只读管理器数组 + 对比时间戳），
; 重挂也是分批做的（默认 64 条/轮 → 256 个目标约 0.8 秒铺回来）。
; 日志里能看到 `native outline: 引擎侧高亮疑似丢失（MonocleMenu 关闭）-> N 个…`
; 以及统计行里的 `resync=N`（N 应该只在用扫描仪之后 +1）。
ResyncOnScannerClose=1

; ===========================================================================
;  ★★★ v4.23：举着扫描仪时「星球扫描目标」让位原版（推荐保持 1）
; ===========================================================================
; 1 = 只要玩家举着手持扫描仪（引擎里的 `MonocleMenu` 开着），**「植物」类别**
;     （FLOR = 星球上的植物 / 矿脉 / 气泉 / 液池，MOD 用 state 7 挂它们）
;     本轮就不参与挂 / 摘 / 重申：不挂新的、不重申老的、也不摘已挂的。
;
; ★ 为什么需要（用户实测反馈 1 的根因）：
;   原版扫描仪在星球上给「可扫描目标」（矿石 / 气体 / 液体 / 植物 / 动物）
;   上色，走的是引擎自己的逐引用求值（RVA 0x159ED90 → 写 state 7/8/9/10），
;   写完立刻被渲染消费。MOD 每 200ms 一轮重申自己的类别状态，就会把引擎刚
;   写上的「扫描前 / 扫描后 / 正在扫描」盖掉 —— 用户看到的就是
;   「扫描前和扫描后颜色无法区分了」。
;   让位之后：举着扫描仪时这类目标完全由原版上色；放下扫描仪那一刻，
;   上面的 ResyncOnScannerClose 会把它们整批铺回青色常亮（约 0.8 秒）。
;
; ★ 为什么只让这一类让位（不是整段停摆）：
;   ① 星球目标（FLOR）走的是 state 7/8（扫描前，青）与 4/5（扫描后，绿，
;      ★ v4.24 已归还引擎）这几个槽位；MOD「武器 / 服饰 / 笔记 / 资源 /
;      容器 / 尸体 / 门」用的是别的槽位，重申它们不影响原版
;      （「设备」「弹药救援」也在用 4/5，但颜色已经是原版绿 —— 见 v4.24 段）；
;   ② 引擎在扫描仪 HUD 建立时会销毁管理器 + 清空状态表（RVA 0x17D4B30）——
;      整段停摆就等于举着扫描仪时**「屏幕中央圆圈之外也高亮」也没了**。
;
; ★ 让位期间**不摘除**这一类已挂条目 ⇒ 不会把引擎自己刚挂的那条 highlight
;   摘掉（那一槽位就是原版在用的）。
; 0 = 退回 v4.22 行为（举着扫描仪也按 state 7 重申）。改完重进游戏生效。
; 日志里搜 `config: yieldTargetsWhileScanning=` 与统计行
; `skip (窗口内): … yield=N`（yield 只在举扫描仪、且本轮有该类候选时增长）。
YieldTargetsWhileScanning=1

; ===========================================================================
;  性能 / 卡顿（v2.2 新增）
; ===========================================================================
; 「掉队」宽限期（毫秒，0 ~ 60000）：目标掉出高亮集合后先留这么久再真正摘掉。
; ★ 治「轻微卡顿」的关键：走路时目标会在集合边缘反复进出，若一掉出就摘、
;   一回来就挂，每 200ms 都要向引擎发一批 Set/Remove，主线程就被磨出 hitch。
;   有宽限期时，绝大多数「进出」只是改一个时间戳，零引擎调用。
UnhighlightGraceMs=1500

; 单轮扫描最多向引擎发多少条「挂/摘」调用（0 ~ 4096，0 = 不限）。
; 换场景 / 读档会积压几百条待办，一口气做完就是一个长卡顿帧；
; 设成 64 时大约每 200ms 处理 64 条，256 个目标不到 1 秒铺完。
MaxOutlineOpsPerScan=64

; ===========================================================================
;  v4.7：外景连续性（星球表面「走着走着全灭」的修复）
; ===========================================================================
; 1 = 外景里跨 cell 边界**不再当「换场景」**处理（默认）。
;     外景的 cell 只是「世界的一块」，跨过边界走一步不是换场景。旧行为（0）会把
;     已挂的高亮**整批转入待摘**（= 全灭）、静置 2 秒不扫描，并且只把新 cell 自己
;     的引用当候选 ⇒ 边界对面的东西永远不亮。实测症状就是「在星球表面走着走着，
;     原本亮着的物体突然不亮了；停下不动才慢慢恢复」。
; 0 = 退回 v4.6 行为，只用于对照排查（配合统计行的 `cell: changes/连续过渡`）。
;
; ★ 判据（不依赖任何新偏移）：「上一个 cell 还在这张『近期 cell 环』里」就说明
;   世界没有被重开（读档 / 进门都经过载入画面，会把环清空）。
; ★ 这条还带了第二个好处：**边界对面的引用也参与扫描**（环里那几个 cell），
;   所以站在边界上时两边都有描边，而不是跨过去才换一批。
ExteriorContinuous=1

; 连续过渡时的静置时间（毫秒，0 ~ 2000）。引擎此刻正在往新 cell 的引用数组里
; 塞东西，但世界并没有重建 ⇒ 给一小段就够（默认 300；设 0 = 完全不静置）。
SettleOnCellCrossMs=300

; 引用数「轻微变化」的容差（0 ~ 65536，默认 256）。
; ★ 治「行走时几乎不扫描」：旧判据是「引用数只要和上一轮不同 ⇒ 跳过约 3 轮
;   （≈600ms）」，而外景 / 城市里走动时加载线程一直在流式增删引用 ⇒ 扫描被反复
;   打断。现在变化量不超过这个容差就**照常扫描**（只记一笔 `流式变化=`），
;   超过（= 换场景时的批量填充）仍然等稳定轮数。
; 设 0 = 退回旧判据（任何变化都重新等）。
StreamJumpTolerance=256

; 每轮最多复检多少个「已挂」目标的 3D 根（0 ~ 1024，默认 32；0 = 关掉这条自愈）。
; ★ 引擎侧描边是按「3D 图节点」登记的，而外景走动时引擎会流式卸载 / 重建 3D
;   （LOD ↔ 真模型互换就是典型）：重建之后管理器里那条登记就没了，MOD 的账本却
;   还记着「挂着」⇒ 那个物体从此不亮（直到它掉出半径再进来）。
;   本项让 MOD 发现「3D 根变了」时**重新挂一次**（走 MaxOutlineOpsPerScan 预算）。
;   日志里出现 `native outline: 3D 重建（ref=…）-> 重挂一次` 或统计行
;   `3D复检: reassert=` 在涨，就说明它真的在干活。
Verify3DPerScan=32

; ===========================================================================
; ★★★ 2026-09-27（订正 R3）：环内 cell 的**分片遍历** —— 治「帧数仍有下降」
; ===========================================================================
; 背景（用户报告 + 当轮日志）：`timing: scan avg=79ms`（每 200ms 一轮 = 主线程
;   占用约 40%），拆开后 = `loop avg=55ms` + `sync avg=14ms`。loop 里只有
;   「遍历引用 + 分类 + 距离」（纯内存读，单条约 1µs）；而「近期 cell 环」里
;   各 cell 的引用原来是**每轮全量遍历**的（环总量上限 kRingRefsCap = 60000，
;   外景大 cell 每个几万引用）⇒ 6 万 × ~0.9µs ≈ 54ms，数字完全对上。
; 本项 = 每个环内 cell 的引用数组**均分成 ≤ N 片**，每轮只遍历**一片**（游标
;   轮转）⇒ 每轮环内遍历量 ≈ 环总量 / N（默认 6 万/5 ≈ 1.2 万 ≈ 10ms 量级）。
;   · 当前 cell（玩家所在）永远不分片（视野里的目标必须即时响应）；
;   · 小 cell（引用数 ≤ 2000）不分片（单 cell / 小场景行为与旧版完全一致）。
; ★ 安全钳制（防闪烁）：分片周期 = 有效片数 × ScanIntervalMs **必须** <
;   UnhighlightGraceMs —— 否则「本轮没被扫到」的目标会在宽限期到期时被摘掉、
;   下一片再挂回来。程序会按这两项自动钳小有效片数（启动日志有一行可核对：
;   `config: ringSliceMaxRounds=… -> 环内 cell 分片…有效片数=…`）。
;   · 默认 5：周期 5 × 200ms = 1000ms < 1500ms ✓（留一整轮余量）；
;   · 若你把 UnhighlightGraceMs 调小（例如 500），有效片数会自动降到 1（= 不分片）。
; 0 或 1 = 关闭分片（每轮全扫，退回旧行为，只用于对照）；
;   若某台机器仍觉得外景掉帧 ⇒ 可以试 8（更细，周期 1.6s 会被宽限期钳到 ≈6）；
;   若想更保守 ⇒ 试 3（每轮遍历量更大但目标刷新更快）。
; 诊断：统计行 `timing2:` 里新增
;   `refs/scan: cur=… ring=… 分片推迟=… | walk=…ms loot=…ms flora=…ms`
;   —— `ring` = 每轮实际遍历的环内引用数（分片生效后应约等于环总量/片数），
;       `分片推迟` = 本轮没扫、留给下几片的那部分（同步增长即为生效）。
RingSliceMaxRounds=5

; ===========================================================================
; ★★★ 订正 R4（性能）：热路径「去内核化」+ 容器判空缓存
; ---------------------------------------------------------------------------
; 背景（用户报告）：**静态场景帧数正常，动态场景（战斗 / 走动时扫到新的高亮
;   物品）卡顿**。同一局日志里的形态：
;     · 08:37 静止：cur+ring = 1538 个引用 ⇒ loop avg=10ms、walk=10ms；
;     · 08:47 走动：cur+ring = 1545 个引用 ⇒ loop avg=63ms、walk=63ms。
;   遍历量 / 候选数 / 判空次数几乎一模一样，墙钟差 6 倍 ⇒ 差的不是「做了多少事」，
;   而是「每件事多贵」；而同一窗口里 sync（引擎调用）两边都是 7ms ⇒ 引擎调用没变慢。
;   变慢的只有 loop 里那一段 —— 那里唯一会「进制内核」的只有两处：
;     · SafeReadMem → ReadProcessMemory（容器 / 尸体判空的库存链，一轮几百次）
;     · IsReadable  → VirtualQuery（形状校验 / 探针）
;   两者都要拿**进程地址空间锁**；游戏流式加载（走动 / 战斗 = 大量 commit /
;   decommit）时那把锁被抢，单次调用从 ~10µs 涨到几百 µs ⇒ 每轮多出几十毫秒。
;
; FastReadMem=1（默认）：把这两条路都换成**不进制内核**的读法 ——
;   · 安全读 = SEH 兜底 + 直接 memcpy（正常内存一条 memcpy，~ns 级）；
;   · 可读性校验 = 逐页 1 字节直读探针（读不出来就触发硬件异常，被 __except 吃掉）。
;   语义与 ReadProcessMemory / VirtualQuery **完全等价**（读不出来 = false）；
;   =0 退回旧行为（只用于对照排查）。
; 诊断：统计行 `timing3:` 里的 `vq=` / `内核读=` / `直读异常=` —— 默认应接近 0；
;   若 `直读异常` 很大 ⇒ 有代码在频繁读「不该读的地址」（把日志发出来）。
FastReadMem=1

; LootCacheTtlMs：容器 / 尸体「判空结果」按引用缓存的时长（毫秒）。
;   原来每个容器 / 尸体**每轮扫描**都要走一遍库存链（SafeReadMem 好几个字段 +
;   逐条目），实测 30+ 次/轮（动态场景里这是最大的一块）。
;   ★ 权威的失效信号是**事件**：拿 / 放物品（TESContainerChangedEvent）、
;     容器界面开 / 关 —— 这些一发生就**立刻**作废全部缓存 ⇒ 「拿空即灭」的
;     延迟与旧版完全一致（下一次扫描 ≤200ms 就会重读）。
;   TTL 只兜住「没有事件的变化」（别的角色 / 脚本动了内容）。
;   0 = 关（每轮实时判空，退回旧行为）。
; 诊断：统计行 `timing3:` 里的 `loot=…(缓存命中=…)`。
LootCacheTtlMs=1500

; ===========================================================================
; ★★★ v4.29：放下扫描仪后的「恢复提速」—— 治「植物 / 矿石比其它物品慢一拍」
; ---------------------------------------------------------------------------
; 背景（用户实测 + 日志核对）：每次放下扫描仪，引擎都会拆 Monocle HUD
;   （销毁 11 个 HighlightManager + 清空「引用→状态」表）⇒ 本 MOD 必须把
;   **全部已挂目标**（那一局 268 个）转入「待重申」重新挂一遍；而重挂按
;   `MaxOutlineOpsPerScan`（默认 64）条/轮分摊 ⇒ 268 个要 5 轮 ≈ 1 秒才铺完。
;   同时「刚扫完 ⇒ 植物 / 矿石从青色（未扫描）变成绿色（已扫描）」这个状态
;   变化也排在**同一条队列**里按距离消耗同一份预算 ⇒ 用户感知就是
;   「植物和矿石的高亮速度明显低于其他物品」。
; 做法：resync（放下扫描仪 / 管理器数量下跌）之后的 `ResyncBoostMs` 毫秒内：
;   ① 每轮重挂预算提到 `ResyncBoostBudget` 条（默认 192 ⇒ 268 个约 2 轮铺完）；
;   ② 「状态变化（青↔绿）」的目标**排到普通重挂之前**先换色。
; 回退：任一项设 0 = 退回旧行为（不用换 DLL）。
;   若「放下扫描仪瞬间」感到轻微卡顿 ⇒ 把 ResyncBoostBudget 降到 96 / 64。
; 日志：resync 那一行的括号里会写明提速是否开启；启动日志有
;   `config: resyncBoost=…ms budget=…` 一行可直接核对。
ResyncBoostMs=2500
ResyncBoostBudget=192

; ===========================================================================
;  v2.3 日志说明（不用配置，这里只是说明）：
;   outline remove: ... graphRemove=1 mapCnt=N
;     · graphRemove=1 才是「摘除真的可用」；=0 说明 3D 图 visitor 那条路没通过校验，
;       此时 F8 关不干净（会打 WARN）。
;     · mapCnt = 状态管理器哈希表里的元素数，应该跟着 outline 一起涨落。
;   timing2: shape avg/max vq= | loop avg/max (refs/scan: cur/ring/分片推迟 | walk/loot/flora)
;            | sync avg/max (unh/add/3D)
;     · vq = 每轮真的问了内核几次 VirtualQuery（v2.3 加了可读区间缓存，应接近 0）
;     · shape 应该是 0~1ms；loop 应该是 1~2ms；sync 只在换场景/走动时才有值；
;     · ★ 订正 R3 细分：loop 的耗时基本 = 遍历引用数 × ~1µs（cache miss 主导）：
;         cur / ring  = 每轮实际遍历的引用数（当前 cell / 环内分片）；
;         分片推迟    = 因分片留到下几轮的引用数（RingSliceMaxRounds 生效时 >0）；
;         walk/loot/flora = loop 内「遍历挑选 / 容器判空 / 植物判据」各占多少 ms；
;         3D          = sync 内 3D 复检（RefGet3D）耗时。
;       判断标准：ring 大 + walk ≈ loop ⇒ 遍历量问题（调 RingSliceMaxRounds）；
;                 loot/flora 占大头 ⇒ 那两段本身慢（把这两个数发出来）。
;   ★★★ 订正 R4：单位改成**真 ms**（原来按次取整会把几百 µs 抹成 0 —— `loot=0ms`
;     就是假象），平均只除「完成轮」，并新增一行 `timing3:`：
;     timing3: 完成=N轮 平均遍历=…个引用/轮 | 细分(µs/轮): walk= classify= loot= probe=
;              flora= 其它= | 调用/轮: classify= loot=(缓存命中=) flora= probe= vq=
;              内核读= 直读异常= | 卡顿: 次数= 合计= 最大= | 最慢一轮: 总= cpu= 引用= …
;       · 细分 = walk（遍历挑选整段）里各子项占多少 µs/轮；「其它」= 纯指针遍历 + 距离；
;       · 调用 = 各项真实执行次数（配耗时才有意义）；
;       · 卡顿 = 遍历内部「每隔 64 个引用」的空档（≥3ms 记一次）——
;         **合计占了 walk 的大头 ⇒ 不是我们的指令慢，而是线程被抢 / 等内存**；
;       · 最慢一轮 = 该窗口最慢那轮的墙钟 + 该轮线程 CPU（`cpu=`）——
;         两者差得越远，越说明那几十毫秒不是我们烧的 CPU。卡顿就是被这几轮拖出来的。
; ===========================================================================
