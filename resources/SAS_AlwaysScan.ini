[General]
; ===========================================================================
;  Starfield Always Scan - 配置
;  部署位置：Data\SFSE\Plugins\SAS_AlwaysScan.ini（与 dll 同目录）
;  改完直接重进游戏即可生效（启动时读一次）。
; ===========================================================================

; 1 = 启动时就开启；0 = 启动时关闭，进游戏后按热键打开
StartEnabled=1

; ===========================================================================
; 视觉层（v2 新增）
; ===========================================================================
; HighlightMode:
;   1 = 原生 outline 高亮（默认）—— 直接驱动引擎自带的那套描边系统，
;       和原版手持扫描仪 / 任务目标 / 工坊高亮**完全同一套渲染**。
;   0 = 旧方案 —— 走 Papyrus 桥给对象 Play 一条 EFSH（上一代 mod 的做法，
;       看起来是一团发光而不是描边），仅作为对照保留。
HighlightMode=1

; 原生高亮使用的 outline 状态 0..11（12 = 无）。引擎按状态取不同配色/样式，
; 这些配色由 GMST 驱动（aHighlightScannableOutlineColorHigh/Low 等）。
;   0/1 = Generic（未扫描 / 已扫描）
;   2/3 = 另一组（低/高）
;   7/8 = 另一组（低/高）
;   9   = 追踪类
; 想换颜色就先试这几个值，改完重进游戏。
OutlineState=0

; 1 = 只高亮玩家正前方的目标（水平夹角在 FrontFovDeg 之内）；0 = 前后都高亮。
; 原版扫描仪靠「中央圆圈」限制，本 MOD 去掉圆圈后用这个选项维持「看得见才亮」的观感。
; ⚠️ 默认关闭：这个判定依赖偏航角的符号约定，先在游戏里确认再打开。
OnlyInFront=0

; OnlyInFront=1 时的水平视野角（度，20 ~ 360）。360 等效于关闭。
FrontFovDeg=110

; 每隔多少毫秒重新向引擎重申一次高亮（500 ~ 60000）。
; 引擎在换场景 / 退出扫描模式时会重建它自己的高亮管理器，所以需要周期性重申。
ReassertMs=3000

; 1 = 引擎的 12 个高亮管理器不存在时，由本 MOD 调用引擎自己的重建函数把它们建出来
;     （不开扫描仪时引擎不会主动建）。0 = 不建（那就只在引擎自己建过之后才有高亮）。
; 除非排查问题，否则保持 1。
AutoEnsureManagers=1

; 开关热键的虚拟键码（十进制）。
;   F1=112  F2=113  F3=114  F4=115  F5=116  F6=117  F7=118  F8=119
;   F9=120  F10=121 F11=122 F12=123
;   Insert=45 Home=36 PgUp=33 Delete=46 End=35 PgDn=34
;   字母/数字直接用 ASCII：A=65 ... Z=90，0=48 ... 9=57
; 0 = 不注册热键（只能靠 StartEnabled 决定，或用控制台命令）
HotkeyVK=119

; 高亮半径（米）。原版手持扫描仪的探测半径是 10 米，这里默认给 50 米。
; 范围 5 ~ 500
RadiusMeters=50

; 每次播放的特效时长（秒）。★ 必须与 Scripts\Source\SAS\SAS_Bridge.psc 的
; CfgGlowDurationSecs() 保持一致，否则会出现「亮一会儿灭掉」。
; 范围 5 ~ 600
GlowDurationSecs=90

; 同时维护的高亮目标上限（8 ~ 512）。目标按「每 2 米一档、每档 6 个」铺满半径，
; 不会全挤在脚边。
MaxTargets=160

; 每秒最多推送多少条 Play 指令（令牌桶稳态速率，0.5 ~ 60）。
; 调大会更跟手但更吃主线程，调小更省。
OpsPerSecond=8

; 令牌桶容量（4 ~ 512）：换场景 / 读档时可以一次性铺满的额度，花完自动回落到稳态速率。
BucketSize=80

; 扫描间隔（毫秒，50 ~ 2000）
ScanIntervalMs=200

; 1 = 每 5 秒往 SFSE\Logs\SAS_AlwaysScan.log 写一行统计；0 = 关闭
LogStats=1
