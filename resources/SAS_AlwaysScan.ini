[General]
; ===========================================================================
;  Starfield Always Scan - 配置
;  部署位置：Data\SFSE\Plugins\SAS_AlwaysScan.ini（与 dll 同目录）
;  改完直接重进游戏即可生效（启动时读一次）。
;
;  ★ v4.0：旧方案（EFSH 着色器 + Papyrus 信箱）已整体删除，下面的
;     HighlightMode / OutlineState / GlowDurationSecs / OpsPerSecond /
;     BucketSize 五个键**不再存在**（留着也不会被读）。
;     高亮现在只有一条路：直接驱动引擎原生的 outline 描边系统。
; ===========================================================================

; 1 = 启动时就开启；0 = 启动时关闭，进游戏后按热键打开
StartEnabled=1

; 开关热键的虚拟键码（十进制）。
;   F1=112  F2=113  F3=114  F4=115  F5=116  F6=117  F7=118  F8=119
;   F9=120  F10=121 F11=122 F12=123
;   Insert=45 Home=36 PgUp=33 Delete=46 End=35 PgDn=34
;   字母/数字直接用 ASCII：A=65 ... Z=90，0=48 ... 9=57
; 0 = 不注册热键（只能靠 StartEnabled 决定）
HotkeyVK=119

; 1 = 按热键切换时在 HUD 上弹一条提示（Always Scan: ON / OFF）；0 = 不弹。
; ★ 提示由桥脚本（SAS_Bridge.psc）弹出：DLL 把状态写进 GLOB `SAS_Notify`，
;   脚本每 0.5 秒轮询一次。绑定失败时只是没有提示，**高亮不受影响**。
NotifyOnToggle=1

; 高亮半径（米）。原版手持扫描仪的探测半径是 10 米，这里默认给 50 米。
; 范围 5 ~ 500
RadiusMeters=50

; 米 → 游戏单位 的换算系数（0.1 ~ 200）。
; 默认 3.4286 来自官方脚本 HumanHeight 4.0 ≈ 1.2 米 的标定。
; 日志里会同时打出「米」和「游戏单位」两个数：
;     config: unitsPerMeter=3.4286 -> 半径 50.0m = 171.4 游戏单位
; 觉得范围偏小/偏大就改这个值（不用重新编译）：
;   实际只有 25 米 → 改成一半（1.7143）；实际有 100 米 → 改成两倍（6.8571）。
UnitsPerMeter=3.4286

; 同时维护的高亮目标上限（8 ~ 1024）。
; 按距离从近到远一路取，取到 MaxTargets 为止。
MaxTargets=256

; 扫描间隔（毫秒，50 ~ 2000）
ScanIntervalMs=200

; 1 = 每 5 秒往 SFSE\Logs\SAS_AlwaysScan.log 写统计；0 = 关闭
; （统计里会带：
;   · `category (本轮选中): loot=… | 类别开关跳过 disabled=…`
;     —— 每个类别各选中多少个；disabled 是被类别开关挡掉的数量（见 EnableXxx）；
;   · `candTypes (…)` / `rejTypes (…)`
;     —— 候选目标 / 被过滤目标的 base formType 直方图。
;        ★ 再遇到「某东西不该亮」或「该亮却没亮」时，把这两行连同截图发出来，
;          formType 号直接指向它是哪一类东西（MSTT=? / MISC=? / CONT=? …）。
;   · `corpse (窗口内累加): 尸体=A (kDead位=B StartsDead标志=C 道具=D 炮塔/机器人/倒地=E) | …`
;     —— ★ v4.2 新增。「尸体该亮却没亮」看 A~E 这几个来源计数，再看日志里
;        `corpse probe:` 那几行（带 ref/base 的 FormID，可和画面里的身体对号入座）；
;        「搜空还亮着」看 `empty=` 有没有在涨，不涨就看启动那一行 inventory calibration。
;   · `timing2: …` 性能拆分。)
LogStats=1

; 1 = 只高亮玩家正前方的目标（水平夹角在 FrontFovDeg 之内）；0 = 前后都高亮。
; 原版扫描仪靠「中央圆圈」限制，本 MOD 去掉圆圈后用这个选项维持「看得见才亮」的观感。
OnlyInFront=0

; OnlyInFront=1 时的水平视野角（度，20 ~ 360）。360 等效于关闭。
FrontFovDeg=110

; ===========================================================================
;  ★ v4.0：分类分色
; ---------------------------------------------------------------------------
;  每个类别用一个 outline 状态，引擎按状态取不同配色（就是原版扫描仪在
;  「未扫描 / 已扫描 / 已完全扫描 / 追踪 / 悬赏 …」之间换色的那套）。
;
;  ★★ 实测的 11 个状态原生配色（1.16.244.0，v4.0.2 亲测，不是猜的）：
;
;      状态  名字                颜色
;      ----  ------------------  ------------------------------------
;        0   Generic             青      ( 62,173,242)
;        1   Scanned             淡蓝白  (179,193,239)
;        2   FullyScanned        蓝      ( 31,142,226)
;        3   Tracked             蓝      ( 31,142,226)  ← 与 2 完全相同
;        4   Bounty              绿      ( 39,198,132)
;        5   Social              绿      ( 39,198,132)  ← 与 4 完全相同
;        6   TargetGeneric       蓝      ( 31,142,226)  ← 与 2 完全相同
;        7   TargetScannable     黑（ref 表为 0，别用）
;        8   TargetScanned       黑（同上，别用）
;        9   TargetFullyScanned  橙      (255,170,  0)
;       10   (?)                 红      (255,  0,  0)
;
;  ⇒ 视觉上真正区分得开的只有 **5 种**：青/淡蓝白/蓝/绿/橙（另加红）。
;    ★ 所以 v4.0.2 把默认值改成了下面这套（v4.0.1 的 0/1/2/3 全是蓝色系，
;      看起来「颜色根本没变」—— 这是当时那个反馈的真正原因）。
;
;  想换：改下面的数字，重进游戏生效；启动日志里 `config: stateByCategory: ...`
;  会打出实际生效值，日志里 `outline colors[install]:` 那一组 11 行是**实况颜色**。
;  可拾取（MISC/BOOK/ARMO/WEAP/AMMO/ALCH/INGR/KEYM/NOTE/SLGM）
StateLoot=2
;  容器（CONT，搜刮的主要目标）—— 给最显眼的橙色
StateContainer=9
;  可交互设备（ACTI / TERM）—— 绿
StateDevice=4
;  门（DOOR）—— 红（原用 0 青，与可拾取的 2 蓝太接近，改用 10 红拉开对比）
StateDoor=10
;  植物（FLOR）—— 绿
StateFlora=5
;  其它（MSTT）—— 淡蓝白
;  ⚠️ 这一类的开关默认是 **关** 的（见下面 EnableOther 的说明），所以下面的颜色
;     只有在你把 EnableOther 改成 1 之后才会看到。
StateOther=1
;  ★ v4.2：尸体 / 怪物尸体（能搜刮的「身体」）—— 默认也是 9 橙（和容器同色）；
;    想和容器区分开可以把这里改成 0（青）或 10（红，注意门已经是红的）。
StateCorpse=9

; ---------------------------------------------------------------------------
;  ★ v4.1：每个类别「是否高亮」（1 = 亮，0 = 不亮）
; ---------------------------------------------------------------------------
; 起因（用户实测反馈）：「有些不能拾取进背包的物品也有边框」—— 被点亮的是纸箱、
; 桌椅、吧台这类东西。它们在游戏数据里是 **MSTT（MovableStatic，可移动静态物）**，
; 这一类绝大多数**不能拾取进背包**，而且**原版手持扫描仪根本不会高亮它们**
; （原版只亮：能拿的 / 能搜的 / 能开的 / 能采的）。所以从 v4.1 起：
;
;      EnableOther=0   ← ★ 默认关（纸箱 / 桌椅 / 吧台 / 飞船模块 这类不再亮）
;
; ★ 而「能拾取进背包的杂物」（咖啡杯 CoffeeMug01、扳手 Tool_Wrench01、各种玩具）
;   在数据里全是 **MISC**，走的是上面 EnableLoot 这一路 —— 不受影响，照常亮。
;
; 想恢复高亮 MSTT（或只留其中某几类），把对应的值改成 1 即可，重进游戏生效。
; 启动日志里会打 `config: categoryEnabled: loot=1, container=1, ..., other=0`。
EnableLoot=1
EnableContainer=1
EnableDevice=1
EnableDoor=1
EnableFlora=1
EnableOther=0
;  ★ v4.2：尸体（含**怪物尸体**）。默认开 —— 人类与生物在数据里同构
;  （都是 ACHR 引用 + NPC_ 基记录），所以一个开关同时管两者，不需要分开设置。
EnableCorpse=1

; ---------------------------------------------------------------------------
;  ★ v4.2：尸体高亮 + 「搜空即熄灭」
; ---------------------------------------------------------------------------
; 判死（三者任一成立就算「可搜刮的尸体」）：
;   ① **运行时 kDead 位**            —— 你在游戏里打死的敌人 / 生物 / 机器人 / 炮塔；
;   ② **记录标志 Starts Dead(0x200)** —— 预置尸体：离线实证 9 530 个 ACHR 里 2 283 个带它，
;      样本有 Loot_Corpse_MinerM_Fresh01 / SE_KT14_*_Corpse / UC_NA_TopherCorpse，
;      以及 **Biome_Prey_Corpse / Biome_Critter_Corpse（星球生物尸体）** ⇒ 人类与怪物一视同仁；
;   ③ **记录标志 Starts Unconscious(0x2000)** —— 炮塔 / 机器人的报废体、倒地可搜刮者
;      （★ v4.2.1 起默认参与，想排除见下面 CorpseUnconscious）。
; 判活 = 活着的 NPC / 生物**一个都不亮**（红线）。
;
; 1 = 连「Starts Unconscious（0x2000，倒地 / 停机 / 昏迷）」的也当尸体点亮。
;
;  ★★ 默认 1（v4.2.1 用户要求）：这一位在数据里**主要是炮塔 / 机器人的报废体** ——
;     离线统计：193 条引用 / 26 个唯一 base，其中 **22 个是机器**：
;       LvlRobotModelA_*（工业/战斗/Aggro/SysDef/Starborn/Varuun…）、
;       LvlTurretShort_* / LvlTurretCompact / LvlTurretQuadrapod、
;       LvlMiniBotA_Base_Clean、JasminesRobot、LvlSecurity_UC、RL012_LvlTurretCompact …
;     这些就是玩家说的「**炮塔 / 机器人尸体**」，走近能搜刮（拿空后同样熄灭）。
;
;  ⚠️ 代价（如实说明）：另外 4 个 base 是活物 —— MS01WoundedSoldier /
;     MS01WoundedScientist（任务里受伤倒地的两人）、LvlCitizen_UC_Male、
;     RL039_LvlSwarmerCritter。它们倒地/昏迷时点亮是合理的（能搜刮），
;     万一遇到「站起来后还亮着」，把这里改成 0 即可（**不用换 DLL**）。
CorpseUnconscious=1

; 1 = 容器 / 尸体「库存为空」就不高亮（**搜空即熄灭**）。默认 1。
;   物品拿光后约 1.5 秒（UnhighlightGraceMs）熄灭。
;   ★ 它依赖「库存列表」位置的一次性运行时标定（只拿容器当样本做形状校验）：
;     标定成功 → 日志 `inventory calibration: off=+0xNN ok=… -> 搜空判空**启用**`；
;     失败 → `… FAILED … -> 搜空判空**关闭**`（不判空，容器 / 尸体照常亮，**不会崩**）。
;   ★ 判定是「所有物品条目的 stack 数量之和为 0」——不是只看条目数，
;     因为引擎拿光物品后**可能留下 count = 0 的空条目**，只看条目数会永远亮着。
SkipEmptyLoot=1

; ---------------------------------------------------------------------------
;  ★ v4.0.1（可选）：自定义类别颜色
; ---------------------------------------------------------------------------
;  引擎为每个 outline 状态各存了「一高一低」两个颜色，并按脉冲相位在两者之间插值
;  （原版扫描仪那个呼吸感就是这么来的）。想精确指定颜色就写 6 位十六进制 RGB：
;
;      ColorLoot=FF8000        ← 橙
;      ColorContainer=00C8FF   ← 青
;      ...
;
;  留空（默认） = 完全用引擎那个状态的原生配色，什么都不改（**推荐先这么用**）。
;  写了 = 把 RGB 覆盖进引擎的每状态配色表（alpha 保持原值），然后刷新管理器并整批重挂。
;
;  ⚠️ 两点要知道：
;    ① 覆盖是**写引擎的全局配色表**，而原版手持扫描仪用的是同一张表 ⇒ 同一个状态的
;       原版描边颜色也会跟着变（这是唯一能做到「精确指定颜色」的途径）。
;    ② 日志里会打 `outline colors: 覆盖 loot 的颜色 -> state=0 #FF8000`，
;       以及 11 个状态的实际颜色 `outline colors[install/world-ready] ...`。
;
;ColorLoot=
;ColorContainer=
;ColorDevice=
;ColorDoor=
;ColorFlora=
;ColorOther=
;ColorCorpse=

; ===========================================================================
;  视觉层其它
; ===========================================================================
; 每隔多少毫秒重新向引擎重申一次已挂的高亮（0 ~ 60000）。
;   ★ 0 = 不重申（默认）。高亮一旦挂上就一直有效（挂/摘都是本 MOD 自己在管），
;     周期性重申只会往引擎的高亮请求通道里灌重复请求，反而可能让描边
;     「一个一个慢慢出来」。只有观察到「高亮会莫名消失」时才打开（例如 5000）。
ReassertMs=0

; 1 = 引擎的高亮管理器不存在时，由本 MOD 调用引擎自己的重建函数把它们建出来
;     （不开扫描仪时引擎不会主动建）。0 = 不建（那就只在引擎自己建过之后才有高亮）。
; 除非排查问题，否则保持 1。
AutoEnsureManagers=1

; ===========================================================================
;  v3.2：用完原版手持扫描仪之后**自动重挂**
; ===========================================================================
; 1 = 玩家放下扫描仪（引擎里的 `MonocleMenu` 关闭）时，把已挂的高亮整批转入
;     「待重申」，按每轮 MaxOutlineOpsPerScan 条的预算重新挂一遍。
;
; ★ 为什么需要：引擎在扫描仪的开关过程中会拆掉扫描仪 HUD，而那个动作会
;   **销毁 11 个 HighlightManager + 清空「引用→状态」表**。于是本 MOD 内部
;   「已挂高亮」的账本全部变成悬空记录 —— 以为还挂着、引擎那边其实已经没了，
;   默认 ReassertMs=0 下不会自愈。
;   实测症状：用完原版扫描仪后高亮全灭，要按两下 F8（先关再开）才回来。
;
; 这条检测**不调用任何引擎函数**（只读管理器数组 + 对比时间戳），
; 重挂也是分批做的（默认 64 条/轮 → 256 个目标约 0.8 秒铺回来）。
; 日志里能看到 `native outline: 引擎侧高亮疑似丢失（MonocleMenu 关闭）-> N 个…`
; 以及统计行里的 `resync=N`（N 应该只在用扫描仪之后 +1）。
ResyncOnScannerClose=1

; ===========================================================================
;  性能 / 卡顿（v2.2 新增）
; ===========================================================================
; 「掉队」宽限期（毫秒，0 ~ 60000）：目标掉出高亮集合后先留这么久再真正摘掉。
; ★ 治「轻微卡顿」的关键：走路时目标会在集合边缘反复进出，若一掉出就摘、
;   一回来就挂，每 200ms 都要向引擎发一批 Set/Remove，主线程就被磨出 hitch。
;   有宽限期时，绝大多数「进出」只是改一个时间戳，零引擎调用。
UnhighlightGraceMs=1500

; 单轮扫描最多向引擎发多少条「挂/摘」调用（0 ~ 4096，0 = 不限）。
; 换场景 / 读档会积压几百条待办，一口气做完就是一个长卡顿帧；
; 设成 64 时大约每 200ms 处理 64 条，256 个目标不到 1 秒铺完。
MaxOutlineOpsPerScan=64

; ===========================================================================
;  v2.3 日志说明（不用配置，这里只是说明）：
;   outline remove: ... graphRemove=1 mapCnt=N
;     · graphRemove=1 才是「摘除真的可用」；=0 说明 3D 图 visitor 那条路没通过校验，
;       此时 F8 关不干净（会打 WARN）。
;     · mapCnt = 状态管理器哈希表里的元素数，应该跟着 outline 一起涨落。
;   timing2: shape avg/max vq= | loop avg/max | sync avg/max (unh/add)
;     · vq = 每轮真的问了内核几次 VirtualQuery（v2.3 加了可读区间缓存，应接近 0）
;     · shape 应该是 0~1ms；loop 应该是 1~2ms；sync 只在换场景/走动时才有值。
; ===========================================================================
