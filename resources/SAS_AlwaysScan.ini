[General]
; ===========================================================================
;  Starfield Always Scan - 配置
;  部署位置：Data\SFSE\Plugins\SAS_AlwaysScan.ini（与 dll 同目录）
;  改完直接重进游戏即可生效（启动时读一次）。
; ===========================================================================

; 1 = 启动时就开启；0 = 启动时关闭，进游戏后按热键打开
StartEnabled=1

; ===========================================================================
; 视觉层（v2 新增）
; ===========================================================================
; HighlightMode:
;   1 = 原生 outline 高亮（默认）—— 直接驱动引擎自带的那套描边系统，
;       和原版手持扫描仪 / 任务目标 / 工坊高亮**完全同一套渲染**。
;   0 = 旧方案 —— 走 Papyrus 桥给对象 Play 一条 EFSH（上一代 mod 的做法，
;       看起来是一团发光而不是描边），仅作为对照保留。
HighlightMode=1

; 原生高亮使用的 outline 状态 0..10（12 = 无）。引擎按状态取不同配色/样式，
; 这些配色由 GMST 驱动（aHighlightScannableOutlineColorHigh/Low 等）。
;   0/1 = Generic（未扫描 / 已扫描）
;   2/3 = 另一组（低/高）
;   7/8 = 另一组（低/高）
;   9   = 追踪类
; 想换颜色就先试这几个值，改完重进游戏。
OutlineState=0

; 1 = 只高亮玩家正前方的目标（水平夹角在 FrontFovDeg 之内）；0 = 前后都高亮。
; 原版扫描仪靠「中央圆圈」限制，本 MOD 去掉圆圈后用这个选项维持「看得见才亮」的观感。
; ⚠️ 默认关闭：这个判定依赖偏航角的符号约定，先在游戏里确认再打开。
OnlyInFront=0

; OnlyInFront=1 时的水平视野角（度，20 ~ 360）。360 等效于关闭。
FrontFovDeg=110

; 每隔多少毫秒重新向引擎重申一次已挂的高亮（0 ~ 60000）。
;   ★ 0 = 不重申（v2.1 起的默认值）。
;   高亮一旦挂上就一直有效（挂/摘都是本 MOD 自己在管），周期性重申只会往引擎的
;   高亮请求通道里灌重复请求，反而可能让描边「一个一个慢慢出来」。
;   只有当你观察到「高亮会莫名消失」时才把它打开（例如 5000）。
ReassertMs=0

; 1 = 引擎的高亮管理器不存在时，由本 MOD 调用引擎自己的重建函数把它们建出来
;     （不开扫描仪时引擎不会主动建）。0 = 不建（那就只在引擎自己建过之后才有高亮）。
; 除非排查问题，否则保持 1。
AutoEnsureManagers=1

; ===========================================================================
; 性能 / 卡顿（v2.2 新增）
; ===========================================================================
; 「掉队」宽限期（毫秒，0 ~ 60000）：目标掉出高亮集合后先留这么久再真正摘掉。
; ★ 治「轻微卡顿」的关键：走路时目标会在集合边缘反复进出，若一掉出就摘、
;   一回来就挂，每 200ms 都要向引擎发一批 Set/Remove，主线程就被磨出 hitch。
; 有宽限期时，绝大多数「进出」只是改一个时间戳，零引擎调用。
UnhighlightGraceMs=1500

; 单轮扫描最多向引擎发多少条「挂/摘」调用（0 ~ 4096，0 = 不限）。
; 换场景 / 读档会积压几百条待办，一口气做完就是一个长卡顿帧；
; 设成 64 时大约每 200ms 处理 64 条，256 个目标不到 1 秒铺完。
MaxOutlineOpsPerScan=64

; 开关热键的虚拟键码（十进制）。
;   F1=112  F2=113  F3=114  F4=115  F5=116  F6=117  F7=118  F8=119
;   F9=120  F10=121 F11=122 F12=123
;   Insert=45 Home=36 PgUp=33 Delete=46 End=35 PgDn=34
;   字母/数字直接用 ASCII：A=65 ... Z=90，0=48 ... 9=57
; 0 = 不注册热键（只能靠 StartEnabled 决定，或用控制台命令）
HotkeyVK=119

; 高亮半径（米）。原版手持扫描仪的探测半径是 10 米，这里默认给 50 米。
; 范围 5 ~ 500
RadiusMeters=50

; ★ v2.3 新增：米 → 游戏单位 的换算系数（0.1 ~ 200）。
; 默认 3.4286 来自官方脚本 HumanHeight 4.0 ≈ 1.2 米 的标定。
; ★ 它只影响「RadiusMeters 折合多少游戏单位」，日志第二行会同时打出这两个数：
;     config: unitsPerMeter=3.4286 -> 半径 50.0m = 171.4 游戏单位
; 如果游戏里觉得范围偏小/偏大，直接改这个值（不用重新编译），例如：
;   觉得实际只有 25 米 → 把本项改成一半（1.7143）；
;   觉得实际有 100 米  → 把本项改成两倍（6.8571）。
UnitsPerMeter=3.4286

; 每次播放的特效时长（秒）。★ 必须与 Scripts\Source\SAS\SAS_Bridge.psc 的
; CfgGlowDurationSecs() 保持一致，否则会出现「亮一会儿灭掉」。
; ★ 只对 HighlightMode=0 的旧方案有效（原生模式不用 EFSH）。
; 范围 5 ~ 600
GlowDurationSecs=90

; 同时维护的高亮目标上限（8 ~ 1024）。
; ★ v2.1 起不再做「每 2 米一档、每档 6 个」的分档限流 —— 那个限流会让同一层货架上
;   距离相近的东西「超出配额的就永远不亮」。现在改成按距离从近到远一路取，
;   取到 MaxTargets 为止（所以这个值基本就是「最多同时高亮多少个」）。
MaxTargets=256

; 每秒最多推送多少条 Play 指令（令牌桶稳态速率，0.5 ~ 60）。
; ★ 只对 HighlightMode=0 的旧方案有效。
OpsPerSecond=8

; 令牌桶容量（4 ~ 512）：换场景 / 读档时可以一次性铺满的额度，花完自动回落到稳态速率。
; ★ 只对 HighlightMode=0 的旧方案有效。
BucketSize=80

; 扫描间隔（毫秒，50 ~ 2000）
ScanIntervalMs=200

; 1 = 每 5 秒往 SFSE\Logs\SAS_AlwaysScan.log 写一行统计；0 = 关闭
; （统计里会额外打一行 rejTypes=...，列出「半径内但类型不在白名单」的 formType 分布，
;   排查「某个东西该亮却没亮」时很有用）
LogStats=1

; ===========================================================================
; v2.3 日志新增（不用配置，这里只是说明）：
;   outline remove: ... graphRemove=1 mapCnt=N
;     · graphRemove=1 才是「摘除真的可用」；=0 说明 3D 图 visitor 那条路没通过校验，
;       此时 F8 关不干净（会打 WARN）。
;     · mapCnt = 状态管理器哈希表里的元素数，应该跟着 outline 一起涨落。
;   timing2: shape avg/ max/ vq= | loop avg/ max/ | sync avg/ max/ (unh/add)
;     · vq = 每轮真的问了内核几次 VirtualQuery（v2.3 加了可读区间缓存，应接近 0）
;     · shape 应该是 0~1ms；loop 应该是 1~2ms；sync 只在换场景/走动时才有值。
; ===========================================================================
